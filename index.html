<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="MOVA" />
<link rel="apple-touch-icon" href="assets/mova-app-icon.png" />
<link rel="icon" href="assets/mova-app-icon.png" />
<title>MOVA</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.46.0/dist/tabler-icons.min.css" />
<link rel="stylesheet" href="css/app.css?v=4" />
</head>
<body>

<div class="mwp-card">
  <div class="mwp-header">
    <div class="mwp-logo" id="logoSlot"></div>
    <p class="mwp-label mwp-daylabel">Move With Purpose</p>
  </div>

  <div style="display:flex; gap:7px; margin-bottom:1.3rem;">
    <button id="tabLogin" class="mwp-label" style="flex:1; padding:10px; border-radius:8px; border:none; background:var(--ink); color:var(--froth); font-size:12px; cursor:pointer;">Log in</button>
    <button id="tabSignup" class="mwp-label" style="flex:1; padding:10px; border-radius:8px; border:none; background:var(--chai); color:var(--ink); font-size:12px; cursor:pointer;">Sign up</button>
  </div>

  <p id="formError" class="mwp-error" style="display:none;"></p>
  <p id="formNotice" class="mwp-body" style="color:var(--latte); font-size:12.5px; margin:0 0 10px; display:none;"></p>

  <form id="authForm">
    <div id="nameField" style="margin-bottom:8px; display:none;">
      <input class="mwp-input" type="text" id="fullName" placeholder="Full name" />
    </div>
    <div style="margin-bottom:8px;">
      <input class="mwp-input" type="email" id="email" placeholder="Email" required />
    </div>
    <div style="margin-bottom:14px;">
      <input class="mwp-input" type="password" id="password" placeholder="Password" required minlength="6" />
    </div>
    <button type="submit" id="submitBtn" class="mwp-btn">Log in</button>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/nav.js"></script>
<script>
document.getElementById('logoSlot').innerHTML = MOVA_WORDMARK_SVG;

let mode = 'login';
const tabLogin = document.getElementById('tabLogin');
const tabSignup = document.getElementById('tabSignup');
const nameField = document.getElementById('nameField');
const submitBtn = document.getElementById('submitBtn');
const formError = document.getElementById('formError');
const formNotice = document.getElementById('formNotice');

function setMode(next) {
  mode = next;
  const isLogin = mode === 'login';
  tabLogin.style.background = isLogin ? 'var(--ink)' : 'var(--chai)';
  tabLogin.style.color = isLogin ? 'var(--froth)' : 'var(--ink)';
  tabSignup.style.background = isLogin ? 'var(--chai)' : 'var(--ink)';
  tabSignup.style.color = isLogin ? 'var(--ink)' : 'var(--froth)';
  nameField.style.display = isLogin ? 'none' : 'block';
  submitBtn.textContent = isLogin ? 'Log in' : 'Sign up';
  formError.style.display = 'none';
  formNotice.style.display = 'none';
}

tabLogin.addEventListener('click', () => setMode('login'));
tabSignup.addEventListener('click', () => setMode('signup'));

document.getElementById('authForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  formError.style.display = 'none';
  formNotice.style.display = 'none';
  submitBtn.disabled = true;

  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  try {
    if (mode === 'login') {
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) throw error;
      window.location.href = 'home.html';
    } else {
      const fullName = document.getElementById('fullName').value.trim();
      const { data, error } = await sb.auth.signUp({
        email,
        password,
        options: { data: { full_name: fullName || 'New Member' } },
      });
      if (error) throw error;
      if (data.session) {
        window.location.href = 'home.html';
      } else {
        setMode('login');
        formNotice.textContent = 'Account created. Check your email to confirm before logging in.';
        formNotice.style.display = 'block';
      }
    }
  } catch (err) {
    formError.textContent = err.message || 'Something went wrong. Please try again.';
    formError.style.display = 'block';
  } finally {
    submitBtn.disabled = false;
  }
});

(async () => {
  const { data: { session } } = await sb.auth.getSession();
  if (session) window.location.href = 'home.html';
})();
</script>
</body>
</html>
