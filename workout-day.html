<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#211E1B" />
<link rel="manifest" href="manifest.json" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="MOVA" />
<link rel="apple-touch-icon" href="assets/mova-app-icon.png" />
<link rel="icon" href="assets/mova-app-icon.png" />
<title>MOVA · Workout Day</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.46.0/dist/tabler-icons.min.css" />
<link rel="stylesheet" href="css/app.css?v=4" />
</head>
<body>

<div class="mwp-card" id="card">
  <p class="mwp-loading">Loading…</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/auth.js"></script>
<script src="js/nav.js"></script>
<script>
(async () => {
  const session = await requireSession();
  if (!session) return;
  const userId = session.user.id;
  const todayStr = new Date().toISOString().slice(0, 10);
  const dayId = new URLSearchParams(window.location.search).get('day');
  const card = document.getElementById('card');

  const { data: day, error } = await sb
    .from('workout_days')
    .select('id, day_number, name, workout_sections(id, name, order_index, exercises(id, name, order_index, target_sets, target_reps))')
    .eq('id', dayId)
    .single();

  if (error || !day) {
    card.innerHTML = '<p class="mwp-loading">Workout day not found.</p>';
    return;
  }

  const { data: todayLogs } = await sb
    .from('exercise_logs')
    .select('exercise_id, set_number')
    .eq('user_id', userId)
    .gte('logged_at', todayStr + 'T00:00:00');

  const setsLoggedByExercise = {};
  (todayLogs || []).forEach((l) => {
    setsLoggedByExercise[l.exercise_id] = Math.max(setsLoggedByExercise[l.exercise_id] || 0, l.set_number);
  });

  const sections = [...day.workout_sections].sort((a, b) => a.order_index - b.order_index);
  const allExercises = sections.flatMap((s) => s.exercises);
  const isCardio = (sec) => sec.name.toLowerCase() === 'cardio';
  const exercisesDone = allExercises.filter((e) => (setsLoggedByExercise[e.id] || 0) >= e.target_sets).length;

  function exerciseRow(ex, cardio) {
    const setsDone = setsLoggedByExercise[ex.id] || 0;
    const complete = setsDone >= ex.target_sets;
    const detail = cardio
      ? `${ex.target_reps} min`
      : `${ex.target_sets} sets × ${ex.target_reps} reps`;
    return `
      <a href="workout-exercise.html?exercise=${ex.id}&day=${day.id}" style="text-decoration:none; display:flex; align-items:center; gap:12px; background:var(--creme); border-radius:12px; padding:14px 16px;">
        <i class="ti ti-video" style="font-size:17px; color:var(--latte); flex-shrink:0;" aria-hidden="true"></i>
        <div style="flex:1;">
          <p class="mwp-title" style="font-size:14px; margin:0; color:var(--ink);">${ex.name}</p>
          <p class="mwp-body" style="font-size:12px; color:var(--latte); margin:2px 0 0;">${detail}</p>
        </div>
        ${complete
          ? '<i class="ti ti-circle-check" style="font-size:19px; color:var(--ink);" aria-hidden="true"></i>'
          : `<span class="mwp-body" style="font-size:12px; color:var(--latte);">${setsDone}/${ex.target_sets}</span>`}
      </a>`;
  }

  card.innerHTML = `
    <div id="headerSlot"></div>
    <a href="workout.html" style="display:inline-flex; align-items:center; gap:5px; text-decoration:none; margin-bottom:1rem;">
      <i class="ti ti-chevron-left" style="font-size:15px; color:var(--latte);" aria-hidden="true"></i>
      <span class="mwp-body" style="font-size:12px; color:var(--latte);">Training split</span>
    </a>

    <p class="mwp-label" style="font-size:11px; color:var(--latte); margin:0 0 1.2rem;">Workout Progress &nbsp;·&nbsp; ${exercisesDone} / ${allExercises.length}</p>

    <div style="display:flex; flex-direction:column; gap:18px;">
      ${sections.map((sec) => `
        <div>
          <p class="mwp-label" style="font-size:12px; color:var(--creme); margin:0 0 8px;">${sec.name}</p>
          <div style="display:flex; flex-direction:column; gap:8px;">
            ${[...sec.exercises].sort((a, b) => a.order_index - b.order_index).map((ex) => exerciseRow(ex, isCardio(sec))).join('')}
          </div>
        </div>
      `).join('')}
    </div>

    <div data-bottom-nav></div>
  `;

  renderHeader(document.getElementById('headerSlot'), { userId, title: day.name });
  renderBottomNav('workout');
})();
</script>
</body>
</html>
