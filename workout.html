<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#211E1B" />
<link rel="manifest" href="manifest.json" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="MOVA" />
<link rel="apple-touch-icon" href="assets/mova-app-icon.png?v=2" />
<link rel="icon" href="assets/mova-app-icon.png?v=2" />
<title>MOVA · Workout</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.46.0/dist/tabler-icons.min.css" />
<link rel="stylesheet" href="css/app.css?v=4" />
</head>
<body>

<div class="mwp-card" id="card">
  <p class="mwp-loading">Loading…</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/auth.js"></script>
<script src="js/nav.js"></script>
<script>
(async () => {
  const session = await requireSession();
  if (!session) return;
  const userId = session.user.id;
  const card = document.getElementById('card');

  const { data: workouts, error } = await sb
    .from('workouts')
    .select('id, name, workout_exercises(id, sets)')
    .eq('client_id', userId)
    .order('name');

  if (error || !workouts || !workouts.length) {
    card.innerHTML = '<div id="headerSlot"></div><p class="mwp-loading">No workout program assigned yet.</p>';
    renderHeader(document.getElementById('headerSlot'), { userId, title: 'Training Split' });
    return;
  }

  const { data: logs } = await sb
    .from('exercise_logs')
    .select('workout_exercise_id, set_number')
    .eq('user_id', userId)
    .not('workout_exercise_id', 'is', null);

  const setsLoggedByWE = {};
  (logs || []).forEach((l) => {
    setsLoggedByWE[l.workout_exercise_id] = Math.max(setsLoggedByWE[l.workout_exercise_id] || 0, l.set_number);
  });

  function workoutStatus(w) {
    const total = w.workout_exercises.length;
    if (!total) return { done: 0, total: 0 };
    const done = w.workout_exercises.filter((we) => (setsLoggedByWE[we.id] || 0) >= we.sets).length;
    return { done, total };
  }

  card.innerHTML = `
    <div id="headerSlot"></div>

    <div style="display:flex; flex-direction:column; gap:10px;">
      ${workouts.map((w) => {
        const { done, total } = workoutStatus(w);
        const complete = total > 0 && done === total;
        return `
        <a href="workout-day.html?workout=${w.id}" style="text-decoration:none; display:flex; align-items:center; gap:13px; background:var(--creme); border-radius:14px; padding:16px;">
          <i class="ti ${complete ? 'ti-square-rounded-check-filled' : 'ti-square-rounded'}" style="font-size:26px; color:${complete ? 'var(--ink)' : 'var(--latte)'}; flex-shrink:0;" aria-hidden="true"></i>
          <div style="flex:1;">
            <p class="mwp-title" style="font-size:15px; margin:0; color:var(--ink);">${w.name}</p>
            <p class="mwp-body" style="font-size:12px; color:var(--latte); margin:2px 0 0;">${total} exercise${total === 1 ? '' : 's'}${total ? ` · ${done}/${total} done` : ''}</p>
          </div>
          <i class="ti ti-chevron-right" style="font-size:18px; color:var(--latte); flex-shrink:0;" aria-hidden="true"></i>
        </a>`;
      }).join('')}
    </div>

    <div data-bottom-nav></div>
  `;

  renderHeader(document.getElementById('headerSlot'), { userId, title: 'Training Split' });
  renderBottomNav('workout');
})();
</script>
</body>
</html>
