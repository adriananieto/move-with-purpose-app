<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Move With Purpose" />
<title>Move With Purpose · Workout</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.46.0/dist/tabler-icons.min.css" />
<link rel="stylesheet" href="css/app.css?v=3" />
</head>
<body>

<div class="mwp-card" id="card">
  <p class="mwp-loading">Loading…</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/auth.js"></script>
<script src="js/nav.js"></script>
<script>
(async () => {
  const session = await requireSession();
  if (!session) return;
  const userId = session.user.id;
  const todayStr = new Date().toISOString().slice(0, 10);

  const { data: days, error } = await sb
    .from('workout_days')
    .select('id, day_number, name, workout_sections(id, exercises(id, target_sets))')
    .order('day_number');

  const card = document.getElementById('card');

  if (error || !days || !days.length) {
    card.innerHTML = '<p class="mwp-loading">No workout program assigned yet.</p>';
    return;
  }

  const { data: todayLogs } = await sb
    .from('exercise_logs')
    .select('exercise_id, set_number')
    .eq('user_id', userId)
    .gte('logged_at', todayStr + 'T00:00:00');

  const setsLoggedByExercise = {};
  (todayLogs || []).forEach((l) => {
    setsLoggedByExercise[l.exercise_id] = Math.max(setsLoggedByExercise[l.exercise_id] || 0, l.set_number);
  });

  function dayStatus(day) {
    const exercises = day.workout_sections.flatMap((s) => s.exercises);
    if (!exercises.length) return { done: 0, total: 0 };
    const total = exercises.length;
    const done = exercises.filter((e) => (setsLoggedByExercise[e.id] || 0) >= e.target_sets).length;
    return { done, total };
  }

  card.innerHTML = `
    <p class="mwp-body" style="font-size:12px; font-weight:500; letter-spacing:1.5px; color:#8F867E; margin:0 0 4px; text-transform:uppercase;">This Week</p>
    <p class="mwp-title" style="font-size:26px; margin:0 0 1.3rem; color:#8F867E; text-transform:uppercase;">Training Split</p>

    <div style="display:flex; flex-direction:column; gap:10px;">
      ${days.map((d) => {
        const { done, total } = dayStatus(d);
        const complete = total > 0 && done === total;
        return `
        <a href="workout-day.html?day=${d.id}" style="text-decoration:none; display:flex; align-items:center; gap:12px; background:#FFFFFF; border:0.5px solid rgba(0,0,0,0.06); border-radius:14px; padding:16px;">
          <div style="width:42px; height:42px; border-radius:50%; background:${complete ? '#8F867E' : '#EAE6E1'}; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
            <span class="mwp-title" style="font-size:15px; color:${complete ? '#FFFFFF' : '#8F867E'};">${d.day_number}</span>
          </div>
          <div style="flex:1;">
            <p class="mwp-title" style="font-size:15px; margin:0; color:#8F867E; text-transform:uppercase;">Day ${d.day_number} · ${d.name}</p>
            <p class="mwp-body" style="font-size:12px; color:#8F867E; margin:2px 0 0; opacity:0.7;">${total} exercise${total === 1 ? '' : 's'}${total ? ` · ${done}/${total} done today` : ''}</p>
          </div>
          ${complete ? '<i class="ti ti-circle-check" style="font-size:20px; color:#8F867E;" aria-hidden="true"></i>' : '<i class="ti ti-chevron-right" style="font-size:18px; color:#C4BEB4;" aria-hidden="true"></i>'}
        </a>`;
      }).join('')}
    </div>

    <div data-bottom-nav></div>
  `;

  renderBottomNav('workout');
})();
</script>
</body>
</html>
