<div style="max-width: 340px; margin: 0 auto;">
<style>
@import url('https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@400;500;600&display=swap');
.mwp-title { font-family: 'Anton', sans-serif; }
.mwp-body { font-family: 'Work Sans', sans-serif; }
.scale-btn { flex:1; background:#FFFFFF; border:0.5px solid rgba(0,0,0,0.08); border-radius:6px; padding:7px 0; font-size:11px; font-family:'Work Sans',sans-serif; color:#8F867E; text-align:center; }
.scale-btn.active { background:#8F867E; color:#FFFFFF; border-color:#8F867E; }
</style>

<div style="position:relative; background: #D7D4D3; border-radius: 26px; padding: 1.6rem 1.3rem; overflow:hidden;">
  <svg viewBox="0 0 300 760" style="position:absolute; top:0; left:0; width:100%; height:100%; opacity:0.5;" preserveAspectRatio="none">
    <path d="M-20,20 C50,-10 100,40 170,20 C230,0 270,40 320,25" fill="none" stroke="#C4C0BC" stroke-width="1.3"/>
    <path d="M-30,340 C40,310 90,360 160,335 C220,315 260,355 320,335" fill="none" stroke="#C4C0BC" stroke-width="1.3"/>
    <circle cx="255" cy="700" r="55" fill="none" stroke="#C4C0BC" stroke-width="1"/>
  </svg>

  <div style="position:relative;">
    <p class="mwp-body" style="font-size:10px; font-weight:500; letter-spacing:1.5px; color:#8F867E; margin:0 0 4px; text-transform:uppercase;">Friday · Week 6</p>
    <p class="mwp-title" style="font-size:20px; margin:0 0 1.1rem; color:#8F867E; text-transform:uppercase;">Weekly Check-in</p>

    <p class="mwp-body" style="font-size:9.5px; font-weight:600; letter-spacing:0.5px; color:#8F867E; margin:0 0 6px; text-transform:uppercase;">Fasting weight</p>
    <div style="background:#FFFFFF; border:0.5px solid rgba(0,0,0,0.06); border-radius:10px; padding:0 12px; display:flex; align-items:center; gap:8px; margin-bottom:0.9rem; height:40px;">
      <input type="number" value="142" style="flex:1; border:none; font-size:14px; font-weight:600; color:#8F867E;" aria-label="Fasting weight" />
      <span class="mwp-body" style="font-size:11px; color:#8F867E;">lb</span>
    </div>

    <p class="mwp-body" style="font-size:9.5px; font-weight:600; letter-spacing:0.5px; color:#8F867E; margin:0 0 6px; text-transform:uppercase;">Photos</p>
    <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:7px; margin-bottom:0.9rem;">
      <div style="aspect-ratio:3/4; background:#FFFFFF; border:1.5px dashed #C4BEB4; border-radius:9px; display:flex; align-items:center; justify-content:center;"><i class="ti ti-camera" style="font-size:14px; color:#C4BEB4;" aria-hidden="true"></i></div>
      <div style="aspect-ratio:3/4; background:#FFFFFF; border:1.5px dashed #C4BEB4; border-radius:9px; display:flex; align-items:center; justify-content:center;"><i class="ti ti-camera" style="font-size:14px; color:#C4BEB4;" aria-hidden="true"></i></div>
      <div style="aspect-ratio:3/4; background:#FFFFFF; border:1.5px dashed #C4BEB4; border-radius:9px; display:flex; align-items:center; justify-content:center;"><i class="ti ti-camera" style="font-size:14px; color:#C4BEB4;" aria-hidden="true"></i></div>
    </div>

    <p class="mwp-body" style="font-size:9.5px; font-weight:600; letter-spacing:0.5px; color:#8F867E; margin:0 0 6px; text-transform:uppercase;">Hunger level</p>
    <div style="display:flex; gap:5px; margin-bottom:0.85rem;">
      <div class="scale-btn">1</div><div class="scale-btn active">2</div><div class="scale-btn">3</div><div class="scale-btn">4</div><div class="scale-btn">5</div>
    </div>

    <p class="mwp-body" style="font-size:9.5px; font-weight:600; letter-spacing:0.5px; color:#8F867E; margin:0 0 6px; text-transform:uppercase;">Energy level</p>
    <div style="display:flex; gap:5px; margin-bottom:0.85rem;">
      <div class="scale-btn">1</div><div class="scale-btn">2</div><div class="scale-btn active">3</div><div class="scale-btn">4</div><div class="scale-btn">5</div>
    </div>

    <p class="mwp-body" style="font-size:9.5px; font-weight:600; letter-spacing:0.5px; color:#8F867E; margin:0 0 6px; text-transform:uppercase;">Plan adherence</p>
    <div style="display:flex; gap:5px; margin-bottom:0.85rem;">
      <div class="scale-btn">1</div><div class="scale-btn">2</div><div class="scale-btn">3</div><div class="scale-btn active">4</div><div class="scale-btn">5</div>
    </div>

    <p class="mwp-body" style="font-size:9.5px; font-weight:600; letter-spacing:0.5px; color:#8F867E; margin:0 0 6px; text-transform:uppercase;">Stress / sleep quality</p>
    <div style="display:flex; gap:5px; margin-bottom:1rem;">
      <div class="scale-btn">1</div><div class="scale-btn active">2</div><div class="scale-btn">3</div><div class="scale-btn">4</div><div class="scale-btn">5</div>
    </div>

    <p class="mwp-body" style="font-size:9.5px; font-weight:600; letter-spacing:0.5px; color:#8F867E; margin:0 0 6px; text-transform:uppercase;">General feedback</p>
    <textarea placeholder="Cómo te sentiste esta semana, dudas, ajustes..." style="width:100%; height:60px; border:0.5px solid rgba(0,0,0,0.06); border-radius:10px; padding:10px 12px; font-size:12px; font-family:'Work Sans',sans-serif; color:#8F867E; resize:none; margin-bottom:1.2rem;"></textarea>

    <button class="mwp-title" style="width:100%; background:#8F867E; color:#FFFFFF; border:none; font-size:13px; padding:13px; border-radius:8px; text-transform:uppercase; letter-spacing:0.5px;">Submit Check-in</button>
  </div>
</div>
</div>
