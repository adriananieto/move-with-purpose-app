<div style="max-width: 340px; margin: 0 auto;">
<style>
@import url('https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@400;500;600&display=swap');
.mwp-title { font-family: 'Anton', sans-serif; }
.mwp-body { font-family: 'Work Sans', sans-serif; }
</style>

<div style="position:relative; background: #D7D4D3; border-radius: 26px; padding: 1.6rem 1.3rem; overflow:hidden;">
  <svg viewBox="0 0 300 620" style="position:absolute; top:0; left:0; width:100%; height:100%; opacity:0.5;" preserveAspectRatio="none">
    <path d="M-20,20 C50,-10 100,40 170,20 C230,0 270,40 320,25" fill="none" stroke="#C4C0BC" stroke-width="1.3"/>
    <circle cx="250" cy="540" r="55" fill="none" stroke="#C4C0BC" stroke-width="1"/>
  </svg>

  <div style="position:relative;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.1rem;">
      <i class="ti ti-x" style="font-size:17px; color:#8F867E;" aria-hidden="true"></i>
      <p class="mwp-title" style="font-size:15px; margin:0; color:#8F867E; text-transform:uppercase;">Log Food · Lunch</p>
      <span style="width:17px;"></span>
    </div>

    <div style="background:#FFFFFF; border:1.5px dashed #C4BEB4; border-radius:12px; aspect-ratio:16/9; margin-bottom:12px; display:flex; align-items:center; justify-content:center; gap:8px;">
      <i class="ti ti-camera" style="font-size:18px; color:#C4BEB4;" aria-hidden="true"></i>
      <p class="mwp-body" style="font-size:11px; color:#C4BEB4; margin:0;">Add a photo</p>
    </div>

    <p class="mwp-body" style="font-size:9.5px; font-weight:600; letter-spacing:0.5px; color:#8F867E; margin:0 0 6px; text-transform:uppercase;">Add each item</p>
    <div style="display:flex; flex-direction:column; gap:6px; margin-bottom:10px;">
      <input type="text" placeholder="Search food, e.g. chicken breast" style="width:100%; height:34px; padding:0 10px; font-size:11.5px; border:0.5px solid rgba(0,0,0,0.1); border-radius:6px; font-family:'Work Sans',sans-serif;" />
      <div style="display:flex; gap:6px;">
        <input type="number" placeholder="Amount" style="flex:1; height:34px; padding:0 10px; font-size:11.5px; border:0.5px solid rgba(0,0,0,0.1); border-radius:6px; font-family:'Work Sans',sans-serif;" />
        <select style="width:68px; height:34px; padding:0 6px; font-size:11.5px; border:0.5px solid rgba(0,0,0,0.1); border-radius:6px; font-family:'Work Sans',sans-serif; color:#8F867E;">
          <option>oz</option><option>g</option><option>cup</option>
        </select>
        <button style="width:34px; height:34px; border-radius:50%; border:none; background:#8F867E; color:#FFFFFF; font-size:16px; flex-shrink:0;" aria-label="Add item">+</button>
      </div>
    </div>

    <div style="display:flex; flex-direction:column; gap:6px; margin-bottom:12px;">
      <div style="display:flex; align-items:center; justify-content:space-between; background:#FFFFFF; border:0.5px solid rgba(0,0,0,0.06); border-radius:9px; padding:9px 12px;">
        <span class="mwp-body" style="font-size:11.5px; color:#8F867E;">Chicken breast · 5 oz</span>
        <div style="display:flex; align-items:center; gap:8px;">
          <span class="mwp-body" style="font-size:10.5px; color:#8F867E; opacity:0.65;">260 cal</span>
          <i class="ti ti-x" style="font-size:12px; color:#C4BEB4;" aria-hidden="true"></i>
        </div>
      </div>
      <div style="display:flex; align-items:center; justify-content:space-between; background:#FFFFFF; border:0.5px solid rgba(0,0,0,0.06); border-radius:9px; padding:9px 12px;">
        <span class="mwp-body" style="font-size:11.5px; color:#8F867E;">Rice · 1 cup</span>
        <div style="display:flex; align-items:center; gap:8px;">
          <span class="mwp-body" style="font-size:10.5px; color:#8F867E; opacity:0.65;">205 cal</span>
          <i class="ti ti-x" style="font-size:12px; color:#C4BEB4;" aria-hidden="true"></i>
        </div>
      </div>
      <div style="display:flex; align-items:center; justify-content:space-between; background:#FFFFFF; border:0.5px solid rgba(0,0,0,0.06); border-radius:9px; padding:9px 12px;">
        <span class="mwp-body" style="font-size:11.5px; color:#8F867E;">Vegetables · 200 g</span>
        <div style="display:flex; align-items:center; gap:8px;">
          <span class="mwp-body" style="font-size:10.5px; color:#8F867E; opacity:0.65;">70 cal</span>
          <i class="ti ti-x" style="font-size:12px; color:#C4BEB4;" aria-hidden="true"></i>
        </div>
      </div>
    </div>

    <div style="background:#8F867E; border-radius:11px; padding:12px; margin-bottom:1.15rem;">
      <p class="mwp-body" style="font-size:9px; letter-spacing:0.5px; color:#EAE6E1; margin:0 0 6px; text-transform:uppercase;">Auto-calculated total</p>
      <p class="mwp-title" style="font-size:20px; margin:0 0 6px; color:#FFFFFF;">535 cal</p>
      <div style="display:flex; gap:12px; font-size:10.5px; color:#EAE6E1;" class="mwp-body">
        <span>42g protein</span><span>58g carbs</span><span>12g fat</span>
      </div>
    </div>

    <button class="mwp-title" style="width:100%; background:#8F867E; color:#FFFFFF; border:none; font-size:13px; padding:13px; border-radius:8px; text-transform:uppercase; letter-spacing:0.5px;">Save Entry</button>
  </div>
</div>
</div>
