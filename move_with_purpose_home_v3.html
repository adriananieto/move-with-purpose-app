<div style="max-width: 340px; margin: 0 auto;">
<style>
@import url('https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@400;500;600&display=swap');
.mwp-title { font-family: 'Anton', sans-serif; }
.mwp-body { font-family: 'Work Sans', sans-serif; }
</style>

<div style="position:relative; background: #D7D4D3; border-radius: 26px; padding: 1.6rem 1.3rem; overflow:hidden;">

  <svg viewBox="0 0 300 520" style="position:absolute; top:0; left:0; width:100%; height:100%; opacity:0.5;" preserveAspectRatio="none">
    <path d="M-20,20 C50,-10 100,40 170,20 C230,0 270,40 320,25" fill="none" stroke="#C4C0BC" stroke-width="1.3"/>
    <path d="M-20,45 C50,15 100,65 170,45 C230,25 270,65 320,50" fill="none" stroke="#C4C0BC" stroke-width="1.3"/>
    <path d="M-30,220 C40,190 90,240 160,215 C220,195 260,235 320,215" fill="none" stroke="#C4C0BC" stroke-width="1.3"/>
    <circle cx="60" cy="380" r="55" fill="none" stroke="#C4C0BC" stroke-width="1"/>
    <circle cx="60" cy="380" r="34" fill="none" stroke="#C4C0BC" stroke-width="1"/>
    <path d="M-20,470 C60,450 110,490 190,468 C250,452 290,480 320,468" fill="none" stroke="#C4C0BC" stroke-width="1.3"/>
  </svg>

  <div style="position:relative;">
    <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom: 1.5rem;">
      <div>
        <p class="mwp-body" style="font-size:10px; font-weight:500; letter-spacing:1.5px; color:#8F867E; margin:0 0 4px; text-transform:uppercase;">Good morning</p>
        <p class="mwp-title" style="font-size:24px; margin:0; color:#8F867E; text-transform:uppercase; letter-spacing:0.5px;">Camila</p>
      </div>
      <div style="width:34px; height:34px; border-radius:50%; background:#FFFFFF; border:0.5px solid rgba(0,0,0,0.06); display:flex; align-items:center; justify-content:center; flex-shrink:0;"><i class="ti ti-user" style="font-size:16px; color:#8F867E;" aria-hidden="true"></i></div>
      </div>

    <div style="background:#8F867E; border-radius:12px; padding:1.15rem 1.1rem; margin-bottom:0.9rem;">
      <p class="mwp-body" style="font-size:9px; font-weight:500; letter-spacing:1.5px; color:#EAE6E1; margin:0 0 6px; text-transform:uppercase;">Weekly Progress</p>
      <div style="display:flex; align-items:baseline; justify-content:space-between;">
        <p class="mwp-title" style="font-size:30px; margin:0; color:#FFFFFF;">72%</p>
        <p class="mwp-body" style="font-size:10px; font-weight:500; color:#EAE6E1; margin:0; text-transform:uppercase; letter-spacing:0.5px;">4 / 5 workouts</p>
      </div>
      <div style="height:3px; background:rgba(255,255,255,0.25); border-radius:2px; margin-top:8px; overflow:hidden;">
        <div style="width:72%; height:100%; background:#FFFFFF;"></div>
      </div>
    </div>

    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:8px; margin-bottom:1.1rem;">
      <div style="background:#FFFFFF; border:0.5px solid rgba(0,0,0,0.06); border-radius:10px; padding:12px;">
        <i class="ti ti-barbell" style="font-size:18px; color:#8F867E;" aria-hidden="true"></i>
        <p class="mwp-title" style="font-size:12px; margin:9px 0 3px; color:#8F867E; text-transform:uppercase; letter-spacing:0.3px;">Training</p>
        <p class="mwp-body" style="font-size:11px; color:#8F867E; margin:0;">Legs · 45 min</p>
      </div>
      <div style="background:#FFFFFF; border:0.5px solid rgba(0,0,0,0.06); border-radius:10px; padding:12px;">
        <i class="ti ti-apple" style="font-size:18px; color:#8F867E;" aria-hidden="true"></i>
        <p class="mwp-title" style="font-size:12px; margin:9px 0 3px; color:#8F867E; text-transform:uppercase; letter-spacing:0.3px;">Nutrition</p>
        <p class="mwp-body" style="font-size:11px; color:#8F867E; margin:0;">1,540 / 1,800 kcal</p>
      </div>
    </div>

    <p class="mwp-body" style="font-size:8.5px; font-weight:500; letter-spacing:1.2px; color:#8F867E; margin:0 0 1rem; text-align:center; text-transform:uppercase;">Move With Intention · Train With Discipline</p>

    <div style="display:flex; justify-content:space-around; border-top:0.5px solid rgba(0,0,0,0.1); padding-top:12px;">
      <i class="ti ti-home" style="font-size:19px; color:#8F867E;" aria-hidden="true"></i>
      <i class="ti ti-barbell" style="font-size:19px; color:#C4BEB4;" aria-hidden="true"></i>
      <i class="ti ti-apple" style="font-size:19px; color:#C4BEB4;" aria-hidden="true"></i>
      <i class="ti ti-chart-line" style="font-size:19px; color:#C4BEB4;" aria-hidden="true"></i>
    </div>
  </div>
