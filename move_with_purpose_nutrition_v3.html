<div style="max-width: 340px; margin: 0 auto;">
<style>
@import url('https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@400;500;600&display=swap');
.mwp-title { font-family: 'Anton', sans-serif; }
.mwp-body { font-family: 'Work Sans', sans-serif; }
</style>

<div style="position:relative; background: #D7D4D3; border-radius: 26px; padding: 1.6rem 1.3rem; overflow:hidden;">
  <svg viewBox="0 0 300 520" style="position:absolute; top:0; left:0; width:100%; height:100%; opacity:0.5;" preserveAspectRatio="none">
    <path d="M-20,20 C50,-10 100,40 170,20 C230,0 270,40 320,25" fill="none" stroke="#C4C0BC" stroke-width="1.3"/>
    <path d="M-30,220 C40,190 90,240 160,215 C220,195 260,235 320,215" fill="none" stroke="#C4C0BC" stroke-width="1.3"/>
    <circle cx="60" cy="470" r="50" fill="none" stroke="#C4C0BC" stroke-width="1"/>
  </svg>

  <div style="position:relative;">
    <p class="mwp-body" style="font-size:10px; font-weight:500; letter-spacing:1.5px; color:#8F867E; margin:0 0 4px; text-transform:uppercase;">Today</p>
    <p class="mwp-title" style="font-size:22px; margin:0 0 1.2rem; color:#8F867E; text-transform:uppercase;">Nutrition</p>

    <div style="display:flex; align-items:center; gap:1rem; margin-bottom:1.2rem;">
      <div style="position:relative; width:72px; height:72px; flex-shrink:0;">
        <svg viewBox="0 0 72 72" style="width:72px; height:72px; transform:rotate(-90deg);">
          <circle cx="36" cy="36" r="30" fill="none" stroke="rgba(0,0,0,0.08)" stroke-width="6"/>
          <circle cx="36" cy="36" r="30" fill="none" stroke="#8F867E" stroke-width="6" stroke-dasharray="188" stroke-dashoffset="65" stroke-linecap="round"/>
        </svg>
        <div style="position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;">
          <span class="mwp-title" style="font-size:13px; color:#8F867E;">1,540</span>
          <span class="mwp-body" style="font-size:8px; color:#8F867E;">/ 1,800</span>
        </div>
      </div>
      <div style="flex:1; display:flex; flex-direction:column; gap:7px;">
        <div>
          <div style="display:flex; justify-content:space-between; font-size:11px; margin-bottom:3px; color:#8F867E;" class="mwp-body"><span>Protein</span><span>98/130g</span></div>
          <div style="height:4px; background:rgba(0,0,0,0.08); border-radius:2px;"><div style="width:75%; height:100%; background:#8F867E; border-radius:2px;"></div></div>
        </div>
        <div>
          <div style="display:flex; justify-content:space-between; font-size:11px; margin-bottom:3px; color:#8F867E;" class="mwp-body"><span>Carbs</span><span>140/180g</span></div>
          <div style="height:4px; background:rgba(0,0,0,0.08); border-radius:2px;"><div style="width:78%; height:100%; background:#8F867E; border-radius:2px;"></div></div>
        </div>
        <div>
          <div style="display:flex; justify-content:space-between; font-size:11px; margin-bottom:3px; color:#8F867E;" class="mwp-body"><span>Fat</span><span>45/60g</span></div>
          <div style="height:4px; background:rgba(0,0,0,0.08); border-radius:2px;"><div style="width:75%; height:100%; background:#8F867E; border-radius:2px;"></div></div>
        </div>
      </div>
    </div>

    <p class="mwp-body" style="font-size:10px; font-weight:600; letter-spacing:0.5px; color:#8F867E; margin:0 0 8px; text-transform:uppercase;">Meal Plan</p>
    <div style="display:flex; flex-direction:column; gap:7px;">
      <div style="display:flex; align-items:center; gap:10px; background:#FFFFFF; border:0.5px solid rgba(0,0,0,0.06); border-radius:12px; padding:10px 12px;">
        <i class="ti ti-sun" style="font-size:16px; color:#8F867E;" aria-hidden="true"></i>
        <div style="flex:1;">
          <p class="mwp-title" style="font-size:11px; margin:0; color:#8F867E; text-transform:uppercase;">Breakfast</p>
          <p class="mwp-body" style="font-size:10.5px; color:#8F867E; margin:0; opacity:0.75;">Oats, eggs, berries</p>
        </div>
        <i class="ti ti-check" style="font-size:15px; color:#8F867E;" aria-hidden="true"></i>
      </div>
      <div style="display:flex; align-items:center; gap:10px; background:#FFFFFF; border:0.5px solid rgba(0,0,0,0.06); border-radius:12px; padding:10px 12px;">
        <i class="ti ti-sun-high" style="font-size:16px; color:#8F867E;" aria-hidden="true"></i>
        <div style="flex:1;">
          <p class="mwp-title" style="font-size:11px; margin:0; color:#8F867E; text-transform:uppercase;">Lunch</p>
          <p class="mwp-body" style="font-size:10.5px; color:#8F867E; margin:0; opacity:0.75;">Chicken, rice, veggies</p>
        </div>
        <div style="width:14px; height:14px; border-radius:50%; border:1.5px solid #C4BEB4;"></div>
      </div>
      <div style="display:flex; align-items:center; gap:10px; background:#FFFFFF; border:0.5px solid rgba(0,0,0,0.06); border-radius:12px; padding:10px 12px;">
        <i class="ti ti-moon" style="font-size:16px; color:#8F867E;" aria-hidden="true"></i>
        <div style="flex:1;">
          <p class="mwp-title" style="font-size:11px; margin:0; color:#8F867E; text-transform:uppercase;">Dinner</p>
          <p class="mwp-body" style="font-size:10.5px; color:#8F867E; margin:0; opacity:0.75;">Salmon, salad</p>
        </div>
        <div style="width:14px; height:14px; border-radius:50%; border:1.5px solid #C4BEB4;"></div>
      </div>
    </div>

    <div style="display:flex; justify-content:space-around; border-top:0.5px solid rgba(0,0,0,0.1); padding-top:12px; margin-top:1.2rem;">
      <i class="ti ti-home" style="font-size:19px; color:#C4BEB4;" aria-hidden="true"></i>
      <i class="ti ti-barbell" style="font-size:19px; color:#C4BEB4;" aria-hidden="true"></i>
      <i class="ti ti-apple" style="font-size:19px; color:#8F867E;" aria-hidden="true"></i>
      <i class="ti ti-chart-line" style="font-size:19px; color:#C4BEB4;" aria-hidden="true"></i>
    </div>
  </div>
</div>
</div>
