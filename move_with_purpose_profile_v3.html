<div style="max-width: 340px; margin: 0 auto;">
<style>
@import url('https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@400;500;600&display=swap');
.mwp-title { font-family: 'Anton', sans-serif; }
.mwp-body { font-family: 'Work Sans', sans-serif; }
</style>

<div style="position:relative; background: #D7D4D3; border-radius: 26px; padding: 1.6rem 1.3rem; overflow:hidden;">
  <svg viewBox="0 0 300 520" style="position:absolute; top:0; left:0; width:100%; height:100%; opacity:0.5;" preserveAspectRatio="none">
    <path d="M-20,20 C50,-10 100,40 170,20 C230,0 270,40 320,25" fill="none" stroke="#C4C0BC" stroke-width="1.3"/>
    <circle cx="250" cy="470" r="55" fill="none" stroke="#C4C0BC" stroke-width="1"/>
  </svg>

  <div style="position:relative;">
    <div style="display:flex; align-items:center; gap:12px; margin-bottom:1.2rem;">
      <div style="width:50px; height:50px; border-radius:50%; background:#8F867E; display:flex; align-items:center; justify-content:center;">
        <span class="mwp-title" style="font-size:15px; color:#FFFFFF;">CM</span>
      </div>
      <div style="flex:1;">
        <p class="mwp-title" style="font-size:15px; margin:0; color:#8F867E; text-transform:uppercase;">Camila Méndez</p>
        <p class="mwp-body" style="font-size:10.5px; color:#8F867E; margin:0; opacity:0.75;">Member since March 2026</p>
      </div>
      <span class="mwp-body" style="font-size:9px; font-weight:600; letter-spacing:0.5px; background:#8F867E; color:#FFFFFF; padding:5px 10px; border-radius:6px; text-transform:uppercase;">Premium</span>
    </div>

    <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:8px; margin-bottom:1.2rem;">
      <div style="background:#FFFFFF; border:0.5px solid rgba(0,0,0,0.06); border-radius:10px; padding:10px; text-align:center;">
        <p class="mwp-title" style="font-size:14px; margin:0; color:#8F867E;">142 lb</p>
        <p class="mwp-body" style="font-size:9px; color:#8F867E; margin:2px 0 0; text-transform:uppercase;">Current</p>
      </div>
      <div style="background:#FFFFFF; border:0.5px solid rgba(0,0,0,0.06); border-radius:10px; padding:10px; text-align:center;">
        <p class="mwp-title" style="font-size:14px; margin:0; color:#8F867E;">-7 lb</p>
        <p class="mwp-body" style="font-size:9px; color:#8F867E; margin:2px 0 0; text-transform:uppercase;">Since start</p>
      </div>
      <div style="background:#FFFFFF; border:0.5px solid rgba(0,0,0,0.06); border-radius:10px; padding:10px; text-align:center;">
        <p class="mwp-title" style="font-size:14px; margin:0; color:#8F867E;">12</p>
        <p class="mwp-body" style="font-size:9px; color:#8F867E; margin:2px 0 0; text-transform:uppercase;">Weeks</p>
      </div>
    </div>

    <p class="mwp-body" style="font-size:10px; font-weight:600; letter-spacing:0.5px; color:#8F867E; margin:0 0 8px; text-transform:uppercase;">Body Weight</p>
    <div style="background:#FFFFFF; border:0.5px solid rgba(0,0,0,0.06); border-radius:12px; padding:14px; margin-bottom:1.2rem;">
      <svg viewBox="0 0 280 90" style="width:100%; height:90px;">
        <polyline points="10,20 55,32 100,28 145,48 190,44 235,62 270,68" fill="none" stroke="#8F867E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="270" cy="68" r="3.5" fill="#8F867E"/>
      </svg>
      <div style="display:flex; justify-content:space-between; font-size:10px; color:#8F867E; margin-top:4px;" class="mwp-body">
        <span>Week 1</span><span>Week 12</span>
      </div>
    </div>

    <p class="mwp-body" style="font-size:10px; font-weight:600; letter-spacing:0.5px; color:#8F867E; margin:0 0 8px; text-transform:uppercase;">Progress Photos</p>
    <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:8px; margin-bottom:0.5rem;">
      <div style="aspect-ratio:3/4; background:#FFFFFF; border:0.5px solid rgba(0,0,0,0.06); border-radius:10px; display:flex; align-items:center; justify-content:center;"><i class="ti ti-photo" style="font-size:17px; color:#C4BEB4;" aria-hidden="true"></i></div>
      <div style="aspect-ratio:3/4; background:#FFFFFF; border:0.5px solid rgba(0,0,0,0.06); border-radius:10px; display:flex; align-items:center; justify-content:center;"><i class="ti ti-photo" style="font-size:17px; color:#C4BEB4;" aria-hidden="true"></i></div>
      <div style="aspect-ratio:3/4; background:#8F867E; border-radius:10px; display:flex; align-items:center; justify-content:center;"><i class="ti ti-plus" style="font-size:17px; color:#FFFFFF;" aria-hidden="true"></i></div>
    </div>

    <div style="display:flex; justify-content:space-around; border-top:0.5px solid rgba(0,0,0,0.1); padding-top:12px; margin-top:1.2rem;">
      <i class="ti ti-home" style="font-size:19px; color:#C4BEB4;" aria-hidden="true"></i>
      <i class="ti ti-barbell" style="font-size:19px; color:#C4BEB4;" aria-hidden="true"></i>
      <i class="ti ti-apple" style="font-size:19px; color:#C4BEB4;" aria-hidden="true"></i>
      <i class="ti ti-chart-line" style="font-size:19px; color:#8F867E;" aria-hidden="true"></i>
    </div>
  </div>
</div>
</div>
