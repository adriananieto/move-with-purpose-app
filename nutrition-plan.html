<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#211E1B" />
<link rel="manifest" href="manifest.json" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="MOVA" />
<link rel="apple-touch-icon" href="assets/mova-app-icon.png?v=2" />
<link rel="icon" href="assets/mova-app-icon.png?v=2" />
<title>MOVA · Nutrition Plan</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.46.0/dist/tabler-icons.min.css" />
<link rel="stylesheet" href="css/app.css?v=4" />
</head>
<body>

<div class="mwp-card" id="card">
  <p class="mwp-loading">Loading…</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/auth.js"></script>
<script src="js/nav.js"></script>
<script>
const MEAL_LABELS = { breakfast: 'Breakfast', snack_am: 'Snack AM', lunch: 'Lunch', snack_pm: 'Snack PM', dinner: 'Dinner' };
const MEAL_ORDER = ['breakfast', 'snack_am', 'lunch', 'snack_pm', 'dinner'];

function macroLine(calories, protein, carbs, fat) {
  const parts = [];
  if (calories != null) parts.push(`${calories} cal`);
  if (protein != null) parts.push(`${protein}g protein`);
  if (carbs != null) parts.push(`${carbs}g carbs`);
  if (fat != null) parts.push(`${fat}g fat`);
  return parts.join(' · ');
}

function mealTargetCard(type, t) {
  return `
    <div style="background:var(--creme); border-radius:12px; padding:13px 14px; margin-bottom:8px;">
      <p class="mwp-title" style="font-size:14px; margin:0 0 3px; color:var(--ink);">${MEAL_LABELS[type]}</p>
      <p class="mwp-body" style="font-size:12px; color:var(--latte); margin:0;">${macroLine(t.calories, t.protein_g, t.carbs_g, t.fat_g)}</p>
    </div>`;
}

function foodGroup(category, foods) {
  return `
    <div style="margin-bottom:14px;">
      <p class="mwp-label" style="font-size:10px; color:var(--creme); margin:0 0 7px;">${category}</p>
      <div style="background:var(--creme); border-radius:12px; padding:4px 14px;">
        ${foods.map((f, idx) => `
          <div style="display:flex; justify-content:space-between; align-items:center; padding:10px 0; ${idx < foods.length - 1 ? 'border-bottom:0.5px solid rgba(0,0,0,0.08);' : ''}">
            <span class="mwp-body" style="font-size:13px; color:var(--ink);">${f.name}</span>
            ${f.portion ? `<span class="mwp-body" style="font-size:11.5px; color:var(--latte);">${f.portion}</span>` : ''}
          </div>`).join('')}
      </div>
    </div>`;
}

function mealOptionsGroup(type, options) {
  return `
    <div style="margin-bottom:14px;">
      <p class="mwp-label" style="font-size:10px; color:var(--creme); margin:0 0 7px;">${MEAL_LABELS[type]}</p>
      <div style="display:flex; flex-direction:column; gap:8px;">
        ${options.map((o) => `
          <div style="background:var(--creme); border-radius:12px; padding:13px 14px;">
            <p class="mwp-title" style="font-size:12.5px; margin:0 0 4px; color:var(--ink);">${o.option_label}</p>
            <p class="mwp-body" style="font-size:12.5px; color:var(--ink); margin:0 0 6px; line-height:1.4;">${o.description}</p>
            <p class="mwp-body" style="font-size:11px; color:var(--latte); margin:0;">${macroLine(o.calories, o.protein_g, o.carbs_g, o.fat_g)}</p>
          </div>`).join('')}
      </div>
    </div>`;
}

(async () => {
  const session = await requireSession();
  if (!session) return;
  const userId = session.user.id;
  const card = document.getElementById('card');

  const [targetRes, mealTargetsRes, foodsRes, optionsRes] = await Promise.all([
    sb.from('nutrition_targets').select('*').eq('user_id', userId).single(),
    sb.from('meal_targets').select('*').eq('user_id', userId),
    sb.from('recommended_foods').select('*').eq('user_id', userId).order('category').order('order_index'),
    sb.from('meal_options').select('*').eq('user_id', userId).order('meal_type').order('order_index'),
  ]);

  const target = targetRes.data;
  const mealTargets = {};
  (mealTargetsRes.data || []).forEach((t) => { mealTargets[t.meal_type] = t; });

  const foodsByCategory = {};
  (foodsRes.data || []).forEach((f) => { (foodsByCategory[f.category] ||= []).push(f); });

  const optionsByMeal = {};
  (optionsRes.data || []).forEach((o) => { (optionsByMeal[o.meal_type] ||= []).push(o); });

  const hasMealTargets = Object.keys(mealTargets).length > 0;
  const hasFoods = Object.keys(foodsByCategory).length > 0;
  const hasOptions = Object.keys(optionsByMeal).length > 0;

  card.innerHTML = `
    <div id="headerSlot"></div>
    <a href="nutrition.html" style="display:inline-flex; align-items:center; gap:5px; text-decoration:none; margin-bottom:1rem;">
      <i class="ti ti-chevron-left" style="font-size:15px; color:var(--latte);" aria-hidden="true"></i>
      <span class="mwp-body" style="font-size:12px; color:var(--latte);">Nutrition</span>
    </a>

    ${target ? `
      <div style="background:var(--latte); border-radius:12px; padding:14px; margin-bottom:1.3rem;">
        <p class="mwp-label" style="font-size:10px; color:var(--ink); margin:0 0 6px;">Daily targets</p>
        <p class="mwp-title" style="font-size:20px; margin:0 0 4px; color:var(--ink);">${target.calories} cal</p>
        <p class="mwp-body" style="font-size:12px; color:var(--ink); margin:0;">${target.protein_g}g protein · ${target.carbs_g}g carbs · ${target.fat_g}g fat</p>
      </div>
    ` : ''}

    ${hasMealTargets ? `
      <p class="mwp-label" style="font-size:11px; color:var(--creme); margin:0 0 9px;">Per-meal targets</p>
      ${MEAL_ORDER.filter((t) => mealTargets[t]).map((t) => mealTargetCard(t, mealTargets[t])).join('')}
      <div style="margin-bottom:0.5rem;"></div>
    ` : ''}

    ${hasFoods ? `
      <p class="mwp-label" style="font-size:11px; color:var(--creme); margin:1.1rem 0 9px;">Recommended foods</p>
      ${Object.keys(foodsByCategory).map((cat) => foodGroup(cat, foodsByCategory[cat])).join('')}
    ` : ''}

    ${hasOptions ? `
      <p class="mwp-label" style="font-size:11px; color:var(--creme); margin:1.1rem 0 9px;">Meal options</p>
      ${MEAL_ORDER.filter((t) => optionsByMeal[t]).map((t) => mealOptionsGroup(t, optionsByMeal[t])).join('')}
    ` : ''}

    ${!hasMealTargets && !hasFoods && !hasOptions ? `
      <p class="mwp-loading">Your coach hasn't added your meal plan details yet.</p>
    ` : ''}

    <div data-bottom-nav></div>
  `;

  renderHeader(document.getElementById('headerSlot'), { userId, title: 'Nutrition Plan' });
  renderBottomNav('nutrition');
})();
</script>
</body>
</html>
