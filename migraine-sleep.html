<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#211E1B" />
<link rel="manifest" href="manifest.json" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="MOVA" />
<link rel="apple-touch-icon" href="assets/mova-app-icon.png?v=2" />
<link rel="icon" href="assets/mova-app-icon.png?v=2" />
<title>MOVA · Migraine &amp; Sleep</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.46.0/dist/tabler-icons.min.css" />
<link rel="stylesheet" href="css/app.css?v=4" />
</head>
<body>

<div class="mwp-card" id="card">
  <p class="mwp-loading">Loading…</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/auth.js"></script>
<script src="js/phase.js"></script>
<script src="js/nav.js"></script>
<script src="js/viewAs.js"></script>
<script src="js/migraineSleep.js"></script>
<script>
(async () => {
  const session = await requireSession();
  if (!session) return;
  const { userId, isReadOnly, viewAsName } = resolveViewer(session);
  renderViewAsBanner(viewAsName);
  const card = document.getElementById('card');

  const items = await fetchMigraineSleepItems(userId);

  card.innerHTML = `
    <div id="headerSlot"></div>
    <a href="profile.html" style="display:inline-flex; align-items:center; gap:5px; text-decoration:none; margin-bottom:1rem;">
      <i class="ti ti-chevron-left" style="font-size:15px; color:var(--latte);" aria-hidden="true"></i>
      <span class="mwp-body" style="font-size:12px; color:var(--latte);">Profile</span>
    </a>

    ${items.length ? `
      <p class="mwp-body" style="font-size:12.5px; color:var(--latte); margin:0 0 1.1rem; line-height:1.5;">Recommendations from your coach to support migraine relief and better sleep.</p>
      <div style="background:var(--froth); border-radius:12px; padding:4px 14px; margin-bottom:1.3rem;">
        ${items.map((it, idx) => `
          <div style="display:flex; justify-content:space-between; align-items:baseline; gap:12px; padding:11px 0; ${idx < items.length - 1 ? 'border-bottom:0.5px solid var(--creme);' : ''}">
            <span class="mwp-body" style="font-size:13px; color:var(--ink); line-height:1.4;">${escapeMigraineSleepText(it.name)}</span>
            ${it.portion ? `<span class="mwp-body" style="font-size:11.5px; color:var(--latte); text-align:right; flex-shrink:0;">${escapeMigraineSleepText(it.portion)}</span>` : ''}
          </div>`).join('')}
      </div>
    ` : `
      <p class="mwp-loading">Your coach hasn't added any Migraine &amp; Sleep recommendations yet.</p>
    `}

    <div data-bottom-nav></div>
  `;

  renderHeader(document.getElementById('headerSlot'), { userId, title: 'Migraine & Sleep' });
  renderBottomNav('profile');
  if (isReadOnly) lockReadOnly(card);
})();
</script>
</body>
</html>
