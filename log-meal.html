<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="MOVA" />
<link rel="apple-touch-icon" href="assets/mova-app-icon.png" />
<link rel="icon" href="assets/mova-app-icon.png" />
<title>MOVA · Log Meal</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.46.0/dist/tabler-icons.min.css" />
<link rel="stylesheet" href="css/app.css?v=4" />
</head>
<body>

<div class="mwp-card" id="card">
  <p class="mwp-loading">Loading…</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/auth.js"></script>
<script src="js/nav.js"></script>
<script src="js/nutritionApi.js"></script>
<script>
const MEAL_LABELS = { breakfast: 'Breakfast', snack_am: 'Snack AM', lunch: 'Lunch', snack_pm: 'Snack PM', dinner: 'Dinner' };
const UNIT_TO_GRAMS = { g: 1, oz: 28.3495, cup: 240 };
const params = new URLSearchParams(window.location.search);
const mealType = MEAL_LABELS[params.get('type')] ? params.get('type') : 'lunch';

let userId;
let items = [];
let photoFile = null;
let manualMode = false;
let searchResults = [];
let selectedFood = null;
let searchTimer = null;

function totals() {
  return items.reduce((acc, i) => ({
    calories: acc.calories + i.calories,
    protein: acc.protein + i.protein,
    carbs: acc.carbs + i.carbs,
    fat: acc.fat + i.fat,
  }), { calories: 0, protein: 0, carbs: 0, fat: 0 });
}

function render() {
  const t = totals();
  document.getElementById('card').innerHTML = `
    <div id="headerSlot"></div>
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.2rem;">
      <a href="nutrition.html" style="line-height:0;"><i class="ti ti-x" style="font-size:19px; color:var(--ink);" aria-hidden="true"></i></a>
      <p class="mwp-title" style="font-size:16px; margin:0; color:var(--ink);">Log Food · ${MEAL_LABELS[mealType]}</p>
      <span style="width:19px;"></span>
    </div>

    <label for="photoInput" style="cursor:pointer; background:var(--chai); border:1.5px dashed var(--creme); border-radius:12px; aspect-ratio:16/9; margin-bottom:14px; display:flex; align-items:center; justify-content:center; gap:8px;">
      <i class="ti ti-camera" style="font-size:20px; color:var(--latte);" aria-hidden="true"></i>
      <p class="mwp-body" style="font-size:12px; color:var(--latte); margin:0;">${photoFile ? photoFile.name : 'Add a photo'}</p>
    </label>
    <input type="file" id="photoInput" accept="image/*" style="display:none;" />

    ${manualMode ? renderManualEntry() : renderFoodSearch()}

    <button id="modeToggle" class="mwp-btn-link" style="margin-bottom:14px; display:block;">${manualMode ? 'Search food database instead' : "Can't find it? Enter manually"}</button>

    <div style="display:flex; flex-direction:column; gap:6px; margin-bottom:12px;">
      ${items.map((item, idx) => `
        <div style="display:flex; align-items:center; justify-content:space-between; background:var(--chai); border-radius:10px; padding:11px 13px;">
          <span class="mwp-body" style="font-size:13px; color:var(--ink);">${item.name} · ${item.amount}${item.unit}</span>
          <div style="display:flex; align-items:center; gap:9px;">
            <span class="mwp-body" style="font-size:11.5px; color:var(--latte);">${item.calories} cal</span>
            <i class="ti ti-x" data-remove="${idx}" style="font-size:13px; color:var(--latte); cursor:pointer;" aria-hidden="true"></i>
          </div>
        </div>`).join('')}
    </div>

    <div style="background:var(--ink); border-radius:12px; padding:14px; margin-bottom:1.2rem;">
      <p class="mwp-label" style="font-size:10px; color:var(--froth); margin:0 0 6px;">Auto-calculated total</p>
      <p class="mwp-title" style="font-size:22px; margin:0 0 6px; color:var(--froth);">${t.calories} cal</p>
      <div style="display:flex; gap:12px; font-size:11.5px; color:var(--froth);" class="mwp-body">
        <span>${t.protein}g protein</span><span>${t.carbs}g carbs</span><span>${t.fat}g fat</span>
      </div>
    </div>

    <p id="saveError" class="mwp-error" style="display:none;"></p>
    <button id="saveBtn" class="mwp-btn" ${items.length === 0 ? 'disabled' : ''}>Save Entry</button>
  `;

  renderHeader(document.getElementById('headerSlot'), { userId });
  attachHandlers();
}

function renderFoodSearch() {
  return `
    <p class="mwp-label" style="font-size:10.5px; color:var(--ink); margin:0 0 7px;">Search food</p>
    <div style="position:relative; margin-bottom:${selectedFood ? '10px' : '14px'};">
      <input type="text" id="foodSearch" placeholder="e.g. chicken breast" class="mwp-input" autocomplete="off" />
      ${searchResults.length ? `
        <div style="position:absolute; top:100%; left:0; right:0; background:var(--chai); border-radius:8px; margin-top:4px; max-height:220px; overflow-y:auto; z-index:10;">
          ${searchResults.map((f, idx) => `
            <div data-select="${idx}" style="padding:10px 12px; font-size:12.5px; color:var(--ink); cursor:pointer; border-bottom:0.5px solid rgba(0,0,0,0.05);" class="mwp-body">
              ${f.description}${f.brandName ? ` <span style="color:var(--latte);">(${f.brandName})</span>` : ''}
            </div>`).join('')}
        </div>` : ''}
    </div>

    ${selectedFood ? `
      <div style="background:var(--chai); border-radius:10px; padding:12px; margin-bottom:14px;">
        <p class="mwp-title" style="font-size:13px; margin:0 0 8px; color:var(--ink);">${selectedFood.description}</p>
        <div style="display:flex; gap:6px; align-items:center; margin-bottom:8px;">
          <input type="number" id="amountValue" value="100" class="mwp-input" style="flex:1;" />
          <select id="amountUnit" class="mwp-select" style="width:74px;">
            <option value="g">g</option><option value="oz">oz</option><option value="cup">cup</option>
          </select>
        </div>
        <p class="mwp-body" style="font-size:11.5px; color:var(--latte); margin:0 0 10px;" id="livePreview"></p>
        <button id="addSelectedBtn" class="mwp-btn" style="padding:10px;">Add to meal</button>
      </div>
    ` : ''}
  `;
}

function renderManualEntry() {
  return `
    <p class="mwp-label" style="font-size:10.5px; color:var(--ink); margin:0 0 7px;">Add manually</p>
    <div style="display:flex; flex-direction:column; gap:7px; margin-bottom:14px;">
      <input type="text" id="itemName" placeholder="Food name" class="mwp-input" />
      <div style="display:flex; gap:6px;">
        <input type="number" id="itemAmount" placeholder="Amount" class="mwp-input" style="flex:1;" />
        <select id="itemUnit" class="mwp-select" style="width:74px;">
          <option>g</option><option>oz</option><option>cup</option>
        </select>
      </div>
      <div style="display:flex; gap:6px;">
        <input type="number" id="itemCalories" placeholder="Calories" class="mwp-input" style="flex:1;" />
        <input type="number" id="itemProtein" placeholder="Protein g" class="mwp-input" style="flex:1;" />
        <input type="number" id="itemCarbs" placeholder="Carbs g" class="mwp-input" style="flex:1;" />
        <input type="number" id="itemFat" placeholder="Fat g" class="mwp-input" style="flex:1;" />
      </div>
      <button id="addManualBtn" class="mwp-btn" style="padding:10px;">Add item</button>
    </div>
  `;
}

function attachHandlers() {
  document.getElementById('photoInput').addEventListener('change', (e) => {
    photoFile = e.target.files[0] || null;
    render();
  });

  document.getElementById('modeToggle').addEventListener('click', () => {
    manualMode = !manualMode;
    searchResults = [];
    selectedFood = null;
    render();
  });

  document.querySelectorAll('[data-remove]').forEach((el) => {
    el.addEventListener('click', () => {
      items.splice(Number(el.dataset.remove), 1);
      render();
    });
  });

  document.getElementById('saveBtn').addEventListener('click', saveEntry);

  if (manualMode) {
    document.getElementById('addManualBtn').addEventListener('click', addManualItem);
  } else {
    const searchInput = document.getElementById('foodSearch');
    searchInput.addEventListener('input', (e) => {
      const q = e.target.value;
      clearTimeout(searchTimer);
      searchTimer = setTimeout(async () => {
        try {
          searchResults = await searchFoods(q);
        } catch {
          searchResults = [];
        }
        render();
        document.getElementById('foodSearch').focus();
        document.getElementById('foodSearch').setSelectionRange(q.length, q.length);
      }, 400);
    });

    document.querySelectorAll('[data-select]').forEach((el) => {
      el.addEventListener('click', () => {
        selectedFood = searchResults[Number(el.dataset.select)];
        searchResults = [];
        render();
      });
    });

    if (selectedFood) {
      const amountInput = document.getElementById('amountValue');
      const unitSelect = document.getElementById('amountUnit');
      const updatePreview = () => {
        const grams = (parseFloat(amountInput.value) || 0) * UNIT_TO_GRAMS[unitSelect.value];
        const m = scaleMacros(selectedFood.per100g, grams);
        document.getElementById('livePreview').textContent = `${m.calories} cal · ${m.protein}g protein · ${m.carbs}g carbs · ${m.fat}g fat`;
      };
      amountInput.addEventListener('input', updatePreview);
      unitSelect.addEventListener('change', updatePreview);
      updatePreview();
      document.getElementById('addSelectedBtn').addEventListener('click', addSelectedFood);
    }
  }
}

function addSelectedFood() {
  const amount = parseFloat(document.getElementById('amountValue').value) || 0;
  const unit = document.getElementById('amountUnit').value;
  const grams = amount * UNIT_TO_GRAMS[unit];
  const m = scaleMacros(selectedFood.per100g, grams);
  items.push({ name: selectedFood.description, amount, unit, ...m });
  selectedFood = null;
  document.getElementById('foodSearch').value = '';
  render();
}

function addManualItem() {
  const name = document.getElementById('itemName').value.trim();
  const amount = parseFloat(document.getElementById('itemAmount').value) || 0;
  const unit = document.getElementById('itemUnit').value;
  const calories = parseInt(document.getElementById('itemCalories').value) || 0;
  const protein = parseFloat(document.getElementById('itemProtein').value) || 0;
  const carbs = parseFloat(document.getElementById('itemCarbs').value) || 0;
  const fat = parseFloat(document.getElementById('itemFat').value) || 0;
  if (!name) return;
  items.push({ name, amount, unit, calories, protein, carbs, fat });
  render();
}

async function saveEntry() {
  const btn = document.getElementById('saveBtn');
  const errEl = document.getElementById('saveError');
  errEl.style.display = 'none';
  btn.disabled = true;

  let photoPath = null;
  if (photoFile) {
    photoPath = `${userId}/meals/${Date.now()}-${photoFile.name}`;
    const { error: uploadError } = await sb.storage.from('photos').upload(photoPath, photoFile);
    if (uploadError) {
      errEl.textContent = uploadError.message;
      errEl.style.display = 'block';
      btn.disabled = false;
      return;
    }
  }

  const t = totals();
  const { data: mealLog, error } = await sb.from('meal_logs').insert({
    user_id: userId,
    meal_type: mealType,
    photo_path: photoPath,
    total_calories: t.calories,
    protein_g: t.protein,
    carbs_g: t.carbs,
    fat_g: t.fat,
  }).select().single();

  if (error) {
    errEl.textContent = error.message;
    errEl.style.display = 'block';
    btn.disabled = false;
    return;
  }

  const { error: itemsError } = await sb.from('meal_log_items').insert(
    items.map((i) => ({
      meal_log_id: mealLog.id,
      food_name: i.name,
      amount: i.amount,
      unit: i.unit,
      calories: i.calories,
      protein_g: i.protein,
      carbs_g: i.carbs,
      fat_g: i.fat,
    }))
  );

  if (itemsError) {
    errEl.textContent = itemsError.message;
    errEl.style.display = 'block';
    btn.disabled = false;
    return;
  }

  window.location.href = 'nutrition.html';
}

(async () => {
  const session = await requireSession();
  if (!session) return;
  userId = session.user.id;
  render();
})();
</script>
</body>
</html>
