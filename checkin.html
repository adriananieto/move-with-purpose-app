<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="MOVA" />
<link rel="apple-touch-icon" href="assets/mova-app-icon.png" />
<link rel="icon" href="assets/mova-app-icon.png" />
<title>MOVA · Check-in</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.46.0/dist/tabler-icons.min.css" />
<link rel="stylesheet" href="css/app.css?v=4" />
<style>
.scale-btn { flex:1; background:var(--chai); border:none; border-radius:6px; padding:9px 0; font-size:13px; font-family:'Poppins',sans-serif; color:var(--ink); text-align:center; cursor:pointer; }
.scale-btn.active { background:var(--ink); color:var(--froth); }
</style>
</head>
<body>

<div class="mwp-card" id="card">
  <p class="mwp-loading">Loading…</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/auth.js"></script>
<script src="js/nav.js"></script>
<script>
let userId, weekNumber;
const state = { hunger: null, energy: null, adherence: null, stress: null, weight: '', bodyFat: '', muscleMass: '', feedback: '' };
const photoFiles = [null, null, null];

function scaleRow(field, label) {
  const btns = [1, 2, 3, 4, 5].map((n) =>
    `<div class="scale-btn ${state[field] === n ? 'active' : ''}" data-field="${field}" data-value="${n}">${n}</div>`
  ).join('');
  return `
    <p class="mwp-label" style="font-size:11px; color:var(--ink); margin:0 0 7px;">${label}</p>
    <div style="display:flex; gap:6px; margin-bottom:1rem;">${btns}</div>`;
}

function render() {
  document.getElementById('card').innerHTML = `
    <div id="headerSlot"></div>

    <p class="mwp-label" style="font-size:11px; color:var(--ink); margin:0 0 7px;">Fasting weight</p>
    <div style="background:var(--chai); border-radius:10px; padding:0 14px; display:flex; align-items:center; gap:8px; margin-bottom:0.9rem; height:46px;">
      <input type="number" id="weightInput" value="${state.weight}" style="flex:1; border:none; background:transparent; font-size:16px; font-weight:600; color:var(--ink); font-family:'Poppins',sans-serif;" aria-label="Fasting weight" />
      <span class="mwp-body" style="font-size:12px; color:var(--latte);">lb</span>
    </div>

    <p class="mwp-label" style="font-size:11px; color:var(--ink); margin:0 0 7px;">Body composition (optional)</p>
    <div style="display:flex; gap:8px; margin-bottom:1rem;">
      <div style="flex:1; background:var(--chai); border-radius:10px; padding:0 14px; display:flex; align-items:center; gap:6px; height:46px;">
        <input type="number" id="bodyFatInput" value="${state.bodyFat}" placeholder="—" style="flex:1; width:0; border:none; background:transparent; font-size:16px; font-weight:600; color:var(--ink); font-family:'Poppins',sans-serif;" aria-label="Body fat percent" />
        <span class="mwp-body" style="font-size:11px; color:var(--latte);">% fat</span>
      </div>
      <div style="flex:1; background:var(--chai); border-radius:10px; padding:0 14px; display:flex; align-items:center; gap:6px; height:46px;">
        <input type="number" id="muscleMassInput" value="${state.muscleMass}" placeholder="—" style="flex:1; width:0; border:none; background:transparent; font-size:16px; font-weight:600; color:var(--ink); font-family:'Poppins',sans-serif;" aria-label="Muscle mass in pounds" />
        <span class="mwp-body" style="font-size:11px; color:var(--latte);">lb muscle</span>
      </div>
    </div>

    <p class="mwp-label" style="font-size:11px; color:var(--ink); margin:0 0 7px;">Photos</p>
    <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:8px; margin-bottom:1rem;">
      ${[0, 1, 2].map((i) => `
        <label for="photo${i}" style="cursor:pointer; aspect-ratio:3/4; background:var(--chai); border:1.5px dashed var(--creme); border-radius:9px; display:flex; align-items:center; justify-content:center; overflow:hidden;">
          ${photoFiles[i] ? `<span class="mwp-body" style="font-size:10px; color:var(--ink); padding:4px; text-align:center;">${photoFiles[i].name}</span>` : '<i class="ti ti-camera" style="font-size:16px; color:var(--latte);" aria-hidden="true"></i>'}
        </label>
        <input type="file" id="photo${i}" accept="image/*" style="display:none;" />
      `).join('')}
    </div>

    ${scaleRow('hunger', 'Hunger level')}
    ${scaleRow('energy', 'Energy level')}
    ${scaleRow('adherence', 'Plan adherence')}
    ${scaleRow('stress', 'Stress / sleep quality')}

    <p class="mwp-label" style="font-size:11px; color:var(--ink); margin:0 0 7px;">General feedback</p>
    <textarea id="feedbackInput" placeholder="How did this week feel? Any questions or adjustments needed..." class="mwp-textarea" style="height:64px; margin-bottom:1.3rem;">${state.feedback}</textarea>

    <p id="submitError" class="mwp-error" style="display:none;"></p>
    <button id="submitBtn" class="mwp-btn">Submit Check-in</button>
  `;

  renderHeader(document.getElementById('headerSlot'), { userId, title: 'Weekly Check-in' });

  document.querySelectorAll('.scale-btn').forEach((btn) => {
    btn.addEventListener('click', () => {
      state[btn.dataset.field] = Number(btn.dataset.value);
      render();
    });
  });

  [0, 1, 2].forEach((i) => {
    document.getElementById(`photo${i}`).addEventListener('change', (e) => {
      photoFiles[i] = e.target.files[0] || null;
      render();
    });
  });

  document.getElementById('weightInput').addEventListener('input', (e) => {
    state.weight = e.target.value;
  });
  document.getElementById('bodyFatInput').addEventListener('input', (e) => {
    state.bodyFat = e.target.value;
  });
  document.getElementById('muscleMassInput').addEventListener('input', (e) => {
    state.muscleMass = e.target.value;
  });
  document.getElementById('feedbackInput').addEventListener('input', (e) => {
    state.feedback = e.target.value;
  });

  document.getElementById('submitBtn').addEventListener('click', submit);
}

async function submit() {
  const btn = document.getElementById('submitBtn');
  const errEl = document.getElementById('submitError');
  errEl.style.display = 'none';
  btn.disabled = true;

  const weight = parseFloat(document.getElementById('weightInput').value);
  if (isNaN(weight)) {
    errEl.textContent = 'Enter your fasting weight.';
    errEl.style.display = 'block';
    btn.disabled = false;
    return;
  }

  const bodyFatVal = parseFloat(document.getElementById('bodyFatInput').value);
  const muscleMassVal = parseFloat(document.getElementById('muscleMassInput').value);
  const bodyFat = isNaN(bodyFatVal) ? null : bodyFatVal;
  const muscleMass = isNaN(muscleMassVal) ? null : muscleMassVal;

  const { error } = await sb.from('checkins').insert({
    user_id: userId,
    week_number: weekNumber,
    fasting_weight_lb: weight,
    body_fat_pct: bodyFat,
    muscle_mass_lb: muscleMass,
    hunger_level: state.hunger,
    energy_level: state.energy,
    adherence_level: state.adherence,
    stress_level: state.stress,
    feedback_text: document.getElementById('feedbackInput').value.trim(),
  });

  if (error) {
    errEl.textContent = error.message;
    errEl.style.display = 'block';
    btn.disabled = false;
    return;
  }

  await sb.from('body_weight_logs').insert({
    user_id: userId,
    weight_lb: weight,
    body_fat_pct: bodyFat,
    muscle_mass_lb: muscleMass,
  });

  for (let i = 0; i < photoFiles.length; i++) {
    const file = photoFiles[i];
    if (!file) continue;
    const path = `${userId}/checkins/week${weekNumber}-${i}-${file.name}`;
    const { error: uploadError } = await sb.storage.from('photos').upload(path, file);
    if (!uploadError) {
      await sb.from('progress_photos').insert({ user_id: userId, storage_path: path });
    }
  }

  window.location.href = 'home.html';
}

(async () => {
  const session = await requireSession();
  if (!session) return;
  userId = session.user.id;

  const phaseStartDate = await getPhaseStartDate(userId);
  weekNumber = phaseStartDate ? computeDayWeek(phaseStartDate).week : 1;

  render();
})();
</script>
</body>
</html>
