<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#211E1B" />
<link rel="manifest" href="manifest.json" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="MOVA" />
<link rel="apple-touch-icon" href="assets/mova-app-icon.png?v=2" />
<link rel="icon" href="assets/mova-app-icon.png?v=2" />
<title>MOVA · Check-in</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.46.0/dist/tabler-icons.min.css" />
<link rel="stylesheet" href="css/app.css?v=4" />
<style>
.scale-btn { flex:1; background:var(--creme); border:none; border-radius:6px; padding:9px 0; font-size:13px; font-family:'Poppins',sans-serif; color:var(--ink); text-align:center; cursor:pointer; }
.scale-btn.active { background:var(--latte); color:var(--ink); }
</style>
</head>
<body>

<div class="mwp-card" id="card">
  <p class="mwp-loading">Loading…</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/auth.js"></script>
<script src="js/nav.js"></script>
<script>
let userId, weekNumber, isExtended;
const state = {
  hunger: null, energy: null, adherence: null, stress: null, sleep: null,
  weight: '', bodyFat: '', muscleMass: '', feedback: '',
  fatMass: '', fatFreeMass: '', skeletalMusclePct: '', visceralFat: '', metabolicAge: '', bmrKcal: '', bodyWaterPct: '',
  waistIn: '', hipIn: '', bustIn: '', armIn: '', thighIn: '',
  sessionsCompleted: '', sessionsPlanned: '',
};
const photoFiles = [null, null, null];
const EXTENDED_NUM_FIELDS = ['fatMass', 'fatFreeMass', 'skeletalMusclePct', 'visceralFat', 'metabolicAge', 'bmrKcal', 'bodyWaterPct', 'waistIn', 'hipIn', 'bustIn', 'armIn', 'thighIn', 'sessionsCompleted', 'sessionsPlanned'];

function scaleRow(field, label) {
  const btns = [1, 2, 3, 4, 5].map((n) =>
    `<div class="scale-btn ${state[field] === n ? 'active' : ''}" data-field="${field}" data-value="${n}">${n}</div>`
  ).join('');
  return `
    <p class="mwp-label" style="font-size:11px; color:var(--creme); margin:0 0 7px;">${label}</p>
    <div style="display:flex; gap:6px; margin-bottom:1rem;">${btns}</div>`;
}

function numBox(field, unit) {
  return `
    <div style="flex:1; background:var(--creme); border-radius:10px; padding:0 14px; display:flex; align-items:center; gap:6px; height:46px;">
      <input type="number" id="${field}Input" value="${state[field]}" placeholder="—" style="flex:1; width:0; border:none; background:transparent; font-size:16px; font-weight:600; color:var(--ink); font-family:'Poppins',sans-serif;" aria-label="${field}" />
      <span class="mwp-body" style="font-size:11px; color:var(--latte);">${unit}</span>
    </div>`;
}

function numGrid(rows) {
  return `<div style="display:grid; grid-template-columns: 1fr 1fr; gap:8px; margin-bottom:1rem;">${rows.map(([field, unit]) => numBox(field, unit)).join('')}</div>`;
}

function render() {
  document.getElementById('card').innerHTML = `
    <div id="headerSlot"></div>
    <a href="home.html" style="display:inline-flex; align-items:center; gap:5px; text-decoration:none; margin-bottom:1rem;">
      <i class="ti ti-chevron-left" style="font-size:15px; color:var(--latte);" aria-hidden="true"></i>
      <span class="mwp-body" style="font-size:12px; color:var(--latte);">Home</span>
    </a>

    <p class="mwp-label" style="font-size:11px; color:var(--creme); margin:0 0 7px;">Fasting weight</p>
    <div style="background:var(--creme); border-radius:10px; padding:0 14px; display:flex; align-items:center; gap:8px; margin-bottom:0.9rem; height:46px;">
      <input type="number" id="weightInput" value="${state.weight}" style="flex:1; border:none; background:transparent; font-size:16px; font-weight:600; color:var(--ink); font-family:'Poppins',sans-serif;" aria-label="Fasting weight" />
      <span class="mwp-body" style="font-size:12px; color:var(--latte);">lb</span>
    </div>

    <p class="mwp-label" style="font-size:11px; color:var(--creme); margin:0 0 7px;">Body composition (optional)</p>
    <div style="display:flex; gap:8px; margin-bottom:1rem;">
      <div style="flex:1; background:var(--creme); border-radius:10px; padding:0 14px; display:flex; align-items:center; gap:6px; height:46px;">
        <input type="number" id="bodyFatInput" value="${state.bodyFat}" placeholder="—" style="flex:1; width:0; border:none; background:transparent; font-size:16px; font-weight:600; color:var(--ink); font-family:'Poppins',sans-serif;" aria-label="Body fat percent" />
        <span class="mwp-body" style="font-size:11px; color:var(--latte);">% fat</span>
      </div>
      <div style="flex:1; background:var(--creme); border-radius:10px; padding:0 14px; display:flex; align-items:center; gap:6px; height:46px;">
        <input type="number" id="muscleMassInput" value="${state.muscleMass}" placeholder="—" style="flex:1; width:0; border:none; background:transparent; font-size:16px; font-weight:600; color:var(--ink); font-family:'Poppins',sans-serif;" aria-label="Muscle mass in pounds" />
        <span class="mwp-body" style="font-size:11px; color:var(--latte);">lb muscle</span>
      </div>
    </div>

    ${isExtended ? `
      <p class="mwp-label" style="font-size:11px; color:var(--creme); margin:0 0 7px;">Extended body composition (optional)</p>
      ${numGrid([
        ['fatMass', 'fat mass lb'], ['fatFreeMass', 'fat-free lb'],
        ['skeletalMusclePct', 'skeletal %'], ['visceralFat', 'visceral'],
        ['metabolicAge', 'metab. age'], ['bmrKcal', 'bmr kcal'],
        ['bodyWaterPct', 'water %'],
      ])}
      <p class="mwp-label" style="font-size:11px; color:var(--creme); margin:0 0 7px;">Measurements (optional, in)</p>
      ${numGrid([
        ['waistIn', 'waist in'], ['hipIn', 'hip in'],
        ['bustIn', 'bust in'], ['armIn', 'arm in'],
        ['thighIn', 'thigh in'],
      ])}
    ` : ''}

    <p class="mwp-label" style="font-size:11px; color:var(--creme); margin:0 0 7px;">Photos</p>
    <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:8px; margin-bottom:1rem;">
      ${[0, 1, 2].map((i) => `
        <label for="photo${i}" style="cursor:pointer; aspect-ratio:3/4; background:var(--creme); border:1.5px dashed var(--latte); border-radius:9px; display:flex; align-items:center; justify-content:center; overflow:hidden;">
          ${photoFiles[i] ? `<span class="mwp-body" style="font-size:10px; color:var(--ink); padding:4px; text-align:center;">${photoFiles[i].name}</span>` : '<i class="ti ti-camera" style="font-size:16px; color:var(--latte);" aria-hidden="true"></i>'}
        </label>
        <input type="file" id="photo${i}" accept="image/*" style="display:none;" />
      `).join('')}
    </div>

    ${scaleRow('hunger', 'Hunger level')}
    ${scaleRow('energy', 'Energy level')}
    ${scaleRow('adherence', 'Plan adherence')}
    ${scaleRow('stress', isExtended ? 'Stress level' : 'Stress / sleep quality')}
    ${isExtended ? scaleRow('sleep', 'Sleep quality') : ''}

    ${isExtended ? `
      <p class="mwp-label" style="font-size:11px; color:var(--creme); margin:0 0 7px;">Sessions this week (optional)</p>
      ${numGrid([
        ['sessionsCompleted', 'completed'], ['sessionsPlanned', 'planned'],
      ])}
    ` : ''}

    <p class="mwp-label" style="font-size:11px; color:var(--creme); margin:0 0 7px;">General feedback</p>
    <textarea id="feedbackInput" placeholder="How did this week feel? Any questions or adjustments needed..." class="mwp-textarea" style="height:64px; margin-bottom:1.3rem;">${state.feedback}</textarea>

    <p id="submitError" class="mwp-error" style="display:none;"></p>
    <button id="submitBtn" class="mwp-btn">Submit Check-in</button>
  `;

  renderHeader(document.getElementById('headerSlot'), { userId, title: 'Weekly Check-in' });

  document.querySelectorAll('.scale-btn').forEach((btn) => {
    btn.addEventListener('click', () => {
      state[btn.dataset.field] = Number(btn.dataset.value);
      render();
    });
  });

  [0, 1, 2].forEach((i) => {
    document.getElementById(`photo${i}`).addEventListener('change', (e) => {
      photoFiles[i] = e.target.files[0] || null;
      render();
    });
  });

  document.getElementById('weightInput').addEventListener('input', (e) => {
    state.weight = e.target.value;
  });
  document.getElementById('bodyFatInput').addEventListener('input', (e) => {
    state.bodyFat = e.target.value;
  });
  document.getElementById('muscleMassInput').addEventListener('input', (e) => {
    state.muscleMass = e.target.value;
  });
  document.getElementById('feedbackInput').addEventListener('input', (e) => {
    state.feedback = e.target.value;
  });

  if (isExtended) {
    EXTENDED_NUM_FIELDS.forEach((field) => {
      document.getElementById(`${field}Input`).addEventListener('input', (e) => {
        state[field] = e.target.value;
      });
    });
  }

  document.getElementById('submitBtn').addEventListener('click', submit);
}

async function submit() {
  const btn = document.getElementById('submitBtn');
  const errEl = document.getElementById('submitError');
  errEl.style.display = 'none';
  btn.disabled = true;

  const weight = parseFloat(document.getElementById('weightInput').value);
  if (isNaN(weight)) {
    errEl.textContent = 'Enter your fasting weight.';
    errEl.style.display = 'block';
    btn.disabled = false;
    return;
  }

  const bodyFatVal = parseFloat(document.getElementById('bodyFatInput').value);
  const muscleMassVal = parseFloat(document.getElementById('muscleMassInput').value);
  const bodyFat = isNaN(bodyFatVal) ? null : bodyFatVal;
  const muscleMass = isNaN(muscleMassVal) ? null : muscleMassVal;

  const payload = {
    user_id: userId,
    week_number: weekNumber,
    fasting_weight_lb: weight,
    body_fat_pct: bodyFat,
    muscle_mass_lb: muscleMass,
    hunger_level: state.hunger,
    energy_level: state.energy,
    adherence_level: state.adherence,
    stress_level: state.stress,
    feedback_text: document.getElementById('feedbackInput').value.trim(),
  };

  if (isExtended) {
    const num = (id) => {
      const v = parseFloat(document.getElementById(id).value);
      return isNaN(v) ? null : v;
    };
    const int = (id) => {
      const v = parseInt(document.getElementById(id).value, 10);
      return isNaN(v) ? null : v;
    };
    Object.assign(payload, {
      fat_mass_lb: num('fatMassInput'),
      fat_free_mass_lb: num('fatFreeMassInput'),
      skeletal_muscle_pct: num('skeletalMusclePctInput'),
      visceral_fat: num('visceralFatInput'),
      metabolic_age: int('metabolicAgeInput'),
      bmr_kcal: int('bmrKcalInput'),
      body_water_pct: num('bodyWaterPctInput'),
      waist_in: num('waistInInput'),
      hip_in: num('hipInInput'),
      bust_in: num('bustInInput'),
      arm_in: num('armInInput'),
      thigh_in: num('thighInInput'),
      sleep_level: state.sleep,
      sessions_completed: int('sessionsCompletedInput'),
      sessions_planned: int('sessionsPlannedInput'),
    });
  }

  const { data: checkin, error } = await sb.from('checkins').insert(payload).select().single();

  if (error) {
    errEl.textContent = error.message;
    errEl.style.display = 'block';
    btn.disabled = false;
    return;
  }

  await sb.from('body_weight_logs').insert({
    user_id: userId,
    weight_lb: weight,
    body_fat_pct: bodyFat,
    muscle_mass_lb: muscleMass,
  });

  for (let i = 0; i < photoFiles.length; i++) {
    const file = photoFiles[i];
    if (!file) continue;
    const path = `${userId}/checkins/week${weekNumber}-${i}-${file.name}`;
    const { error: uploadError } = await sb.storage.from('photos').upload(path, file);
    if (!uploadError) {
      await sb.from('progress_photos').insert({ user_id: userId, storage_path: path, checkin_id: checkin.id });
    }
  }

  window.location.href = 'home.html';
}

(async () => {
  const session = await requireSession();
  if (!session) return;
  userId = session.user.id;

  const [phaseStartDate, profileRes] = await Promise.all([
    getPhaseStartDate(userId),
    sb.from('profiles').select('extended_tracking').eq('id', userId).single(),
  ]);
  weekNumber = phaseStartDate ? computeDayWeek(phaseStartDate).week : 1;
  isExtended = !!profileRes.data?.extended_tracking;

  render();
})();
</script>
</body>
</html>
