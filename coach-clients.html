<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#211E1B" />
<link rel="manifest" href="manifest.json" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="MOVA" />
<link rel="apple-touch-icon" href="assets/mova-app-icon.png?v=2" />
<link rel="icon" href="assets/mova-app-icon.png?v=2" />
<title>MOVA · Coach</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.46.0/dist/tabler-icons.min.css" />
<link rel="stylesheet" href="css/app.css?v=4" />
</head>
<body>

<div class="mwp-card" id="card">
  <p class="mwp-loading">Loading…</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/auth.js"></script>
<script src="js/phase.js"></script>
<script src="js/nav.js"></script>
<script src="js/viewAs.js"></script>
<script>
(async () => {
  const session = await requireSession();
  if (!session) return;
  const userId = session.user.id;
  const card = document.getElementById('card');

  const { data: me } = await sb.from('profiles').select('is_coach').eq('id', userId).single();
  if (!me?.is_coach) {
    card.innerHTML = `
      <div id="headerSlot"></div>
      <p class="mwp-loading">This screen is only for coach accounts.</p>
      <a href="home.html" class="mwp-btn" style="display:block; text-decoration:none; box-sizing:border-box; text-align:center; margin-top:1rem;">Back home</a>
    `;
    renderHeader(document.getElementById('headerSlot'), { title: 'Coach' });
    return;
  }

  const [clientsRes, checkinsRes] = await Promise.all([
    sb.from('profiles').select('id, full_name, member_since, paused_since, paused_days').neq('id', userId).order('full_name'),
    sb.from('checkins').select('user_id, submitted_at').order('submitted_at', { ascending: false }),
  ]);

  const clients = clientsRes.data || [];
  const lastCheckinByUser = {};
  (checkinsRes.data || []).forEach((c) => {
    if (!lastCheckinByUser[c.user_id]) lastCheckinByUser[c.user_id] = c.submitted_at;
  });

  function clientRow(c) {
    const last = lastCheckinByUser[c.id];
    const lastText = last
      ? `Last check-in ${new Date(last).toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}`
      : 'No check-ins yet';
    return `
      <div style="display:flex; align-items:center; gap:13px; background:var(--creme); border-radius:14px; padding:16px;">
        <div style="width:38px; height:38px; border-radius:50%; background:var(--latte); display:flex; align-items:center; justify-content:center; flex-shrink:0;">
          <span class="mwp-title" style="font-size:13px; color:var(--ink);">${c.full_name.split(' ').filter(Boolean).slice(0, 2).map((p) => p[0].toUpperCase()).join('')}</span>
        </div>
        <div style="flex:1;">
          <p class="mwp-title" style="font-size:15px; margin:0; color:var(--ink);">${c.full_name}${c.paused_since ? ' <span class="mwp-label" style="font-size:9px; background:var(--ink); color:var(--creme); border-radius:6px; padding:3px 7px; margin-left:4px; vertical-align:middle;">Paused</span>' : ''}</p>
          <p class="mwp-body" style="font-size:12px; color:var(--latte); margin:2px 0 0;">${lastText}</p>
        </div>
        ${c.paused_since
          ? `<button type="button" data-resume="${c.id}" style="all:unset; cursor:pointer; display:flex; align-items:center; justify-content:center; width:32px; height:32px;" title="Resume program"><i class="ti ti-player-play" style="font-size:18px; color:var(--latte);" aria-hidden="true"></i></button>`
          : `<button type="button" data-pause="${c.id}" style="all:unset; cursor:pointer; display:flex; align-items:center; justify-content:center; width:32px; height:32px;" title="Pause program"><i class="ti ti-player-pause" style="font-size:18px; color:var(--latte);" aria-hidden="true"></i></button>`}
        <button type="button" data-view-as="${c.id}" data-view-as-name="${c.full_name}" style="all:unset; cursor:pointer; display:flex; align-items:center; justify-content:center; width:32px; height:32px;" title="View as client"><i class="ti ti-eye" style="font-size:18px; color:var(--latte);" aria-hidden="true"></i></button>
        <a href="coach-client-plan.html?client=${c.id}" style="text-decoration:none; display:flex; align-items:center; justify-content:center; width:32px; height:32px;" title="Plan"><i class="ti ti-clipboard-list" style="font-size:18px; color:var(--latte);" aria-hidden="true"></i></a>
        <a href="coach-checkins.html?client=${c.id}" style="text-decoration:none; display:flex; align-items:center; justify-content:center; width:32px; height:32px;" title="Check-ins"><i class="ti ti-chevron-right" style="font-size:18px; color:var(--latte);" aria-hidden="true"></i></a>
      </div>`;
  }

  card.innerHTML = `
    <div id="headerSlot"></div>
    <a href="home.html" style="display:inline-flex; align-items:center; gap:5px; text-decoration:none; margin-bottom:1rem;">
      <i class="ti ti-chevron-left" style="font-size:15px; color:var(--latte);" aria-hidden="true"></i>
      <span class="mwp-body" style="font-size:12px; color:var(--latte);">Home</span>
    </a>

    ${clients.length ? `
      <div style="display:flex; flex-direction:column; gap:10px;">
        ${clients.map(clientRow).join('')}
      </div>
    ` : '<p class="mwp-loading">No clients yet.</p>'}
  `;

  renderHeader(document.getElementById('headerSlot'), { title: 'Clients' });

  document.querySelectorAll('[data-view-as]').forEach((btn) => {
    btn.addEventListener('click', () => startViewAsClient(btn.dataset.viewAs, btn.dataset.viewAsName));
  });

  // Pause / Resume: narrow RPCs (supabase/coach_pause_support.sql) that only
  // touch paused_since / paused_days. "Today" is the local date (js/phase.js).
  async function setPaused(btn, fn, clientId, confirmText) {
    if (!confirm(confirmText)) return;
    btn.disabled = true;
    btn.style.opacity = '0.4';
    const { error } = await sb.rpc(fn, { p_client_id: clientId, p_today: localDateStr() });
    if (error) {
      btn.disabled = false;
      btn.style.opacity = '';
      alert(`Couldn't update: ${error.message}`);
      return;
    }
    window.location.reload();
  }
  document.querySelectorAll('[data-pause]').forEach((btn) => {
    btn.addEventListener('click', () => setPaused(btn, 'coach_pause_client', btn.dataset.pause, 'Pause this client\'s program?'));
  });
  document.querySelectorAll('[data-resume]').forEach((btn) => {
    btn.addEventListener('click', () => setPaused(btn, 'coach_resume_client', btn.dataset.resume, 'Resume this client\'s program?'));
  });
})();
</script>
</body>
</html>
