<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#211E1B" />
<link rel="manifest" href="manifest.json" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="MOVA" />
<link rel="apple-touch-icon" href="assets/mova-app-icon.png?v=2" />
<link rel="icon" href="assets/mova-app-icon.png?v=2" />
<title>MOVA · My Check-ins</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.46.0/dist/tabler-icons.min.css" />
<link rel="stylesheet" href="css/app.css?v=4" />
</head>
<body>

<div class="mwp-card" id="card">
  <p class="mwp-loading">Loading…</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/auth.js"></script>
<script src="js/nav.js"></script>
<script>
function checkinCard(c) {
  const date = new Date(c.submitted_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  return `
    <div style="background:var(--creme); border-radius:14px; padding:16px; margin-bottom:12px;">
      <div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px;">
        <p class="mwp-title" style="font-size:15px; margin:0; color:var(--ink);">Week ${c.week_number}</p>
        <p class="mwp-body" style="font-size:11px; color:var(--latte); margin:0;">${date}</p>
      </div>

      ${c.feedback_text ? `
        <p class="mwp-label" style="font-size:9px; color:var(--latte); margin:0 0 4px;">Your notes</p>
        <p class="mwp-body" style="font-size:12.5px; color:var(--ink); margin:0 0 12px; line-height:1.4;">${c.feedback_text}</p>
      ` : ''}

      ${c.coach_reply ? `
        <div style="background:var(--froth, #fff); border-radius:10px; padding:10px 12px;">
          <p class="mwp-label" style="font-size:9px; color:var(--latte); margin:0 0 4px;">Coach's reply</p>
          <p class="mwp-body" style="font-size:12.5px; color:var(--ink); margin:0; line-height:1.4;">${c.coach_reply}</p>
        </div>
      ` : `
        <p class="mwp-body" style="font-size:11.5px; color:var(--latte); margin:0; font-style:italic;">Waiting on your coach's reply…</p>
      `}
    </div>`;
}

(async () => {
  const session = await requireSession();
  if (!session) return;
  const userId = session.user.id;
  const card = document.getElementById('card');

  const { data: checkins } = await sb.from('checkins')
    .select('*')
    .eq('user_id', userId)
    .order('submitted_at', { ascending: false });

  card.innerHTML = `
    <div id="headerSlot"></div>
    <a href="home.html" style="display:inline-flex; align-items:center; gap:5px; text-decoration:none; margin-bottom:1rem;">
      <i class="ti ti-chevron-left" style="font-size:15px; color:var(--latte);" aria-hidden="true"></i>
      <span class="mwp-body" style="font-size:12px; color:var(--latte);">Home</span>
    </a>

    ${checkins && checkins.length
      ? checkins.map(checkinCard).join('')
      : '<p class="mwp-loading">No check-ins submitted yet.</p>'}
  `;

  renderHeader(document.getElementById('headerSlot'), { userId, title: 'My Check-ins' });
})();
</script>
</body>
</html>
