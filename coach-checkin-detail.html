<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Move With Purpose" />
<title>Move With Purpose · Check-in Detail</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.46.0/dist/tabler-icons.min.css" />
<link rel="stylesheet" href="css/app.css?v=3" />
</head>
<body>

<div class="mwp-card" id="card">
  <p class="mwp-loading">Loading…</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/auth.js"></script>
<script>
function initials(name) {
  return name.split(' ').filter(Boolean).slice(0, 2).map((p) => p[0].toUpperCase()).join('');
}

function scoreRow(label, value) {
  const low = value !== null && value <= 2;
  return `
    <div style="display:flex; justify-content:space-between; align-items:center; background:#FFFFFF; border:0.5px solid rgba(0,0,0,0.06); border-radius:9px; padding:10px 13px; ${low ? 'border-left:3px solid #C0392B;' : ''}">
      <span class="mwp-body" style="font-size:12.5px; color:#8F867E;">${label}</span>
      <span class="mwp-title" style="font-size:13px; color:${low ? '#C0392B' : '#8F867E'};">${value ?? '—'}/5</span>
    </div>`;
}

(async () => {
  const session = await requireSession();
  if (!session) return;

  const { data: myProfile } = await sb.from('profiles').select('role').eq('id', session.user.id).single();
  if (myProfile?.role !== 'coach') {
    window.location.href = 'home.html';
    return;
  }

  const checkinId = new URLSearchParams(window.location.search).get('checkin');
  const card = document.getElementById('card');

  const { data: checkin, error } = await sb.from('checkins').select('*').eq('id', checkinId).single();
  if (error || !checkin) {
    card.innerHTML = '<p class="mwp-loading">Check-in not found.</p>';
    return;
  }

  const [clientRes, historyRes, photosRes] = await Promise.all([
    sb.from('profiles').select('full_name').eq('id', checkin.user_id).single(),
    sb.from('checkins').select('id, fasting_weight_lb, submitted_at').eq('user_id', checkin.user_id).order('submitted_at', { ascending: true }),
    sb.from('progress_photos').select('storage_path').eq('user_id', checkin.user_id).eq('taken_at', checkin.submitted_at.slice(0, 10)),
  ]);

  const client = clientRes.data || { full_name: 'Client' };
  const history = historyRes.data || [];
  const photos = photosRes.data || [];

  const idx = history.findIndex((h) => h.id === checkin.id);
  const prev = idx > 0 ? history[idx - 1] : null;
  const weightChange = prev && prev.fasting_weight_lb && checkin.fasting_weight_lb
    ? Math.round((checkin.fasting_weight_lb - prev.fasting_weight_lb) * 10) / 10
    : null;

  const submittedDate = new Date(checkin.submitted_at).toLocaleDateString('en-US', { weekday: 'long', hour: 'numeric', minute: '2-digit' });

  card.innerHTML = `
    <div style="display:flex; align-items:center; gap:11px; margin-bottom:1.2rem;">
      <a href="coach-dashboard.html" style="line-height:0;"><i class="ti ti-chevron-left" style="font-size:20px; color:#8F867E;" aria-hidden="true"></i></a>
      <div style="width:38px; height:38px; border-radius:50%; background:#8F867E; display:flex; align-items:center; justify-content:center; flex-shrink:0;"><span class="mwp-title" style="font-size:13px; color:#FFFFFF;">${initials(client.full_name)}</span></div>
      <div style="flex:1;">
        <p class="mwp-title" style="font-size:15px; margin:0; color:#8F867E; text-transform:uppercase;">${client.full_name}</p>
        <p class="mwp-body" style="font-size:11px; color:#8F867E; margin:0; opacity:0.7;">Week ${checkin.week_number} · ${submittedDate}</p>
      </div>
    </div>

    <div style="background:#FFFFFF; border:0.5px solid rgba(0,0,0,0.06); border-radius:12px; padding:13px; margin-bottom:0.9rem; display:flex; justify-content:space-between; align-items:center;">
      <div>
        <p class="mwp-body" style="font-size:10px; color:#8F867E; margin:0 0 3px; text-transform:uppercase; letter-spacing:0.5px;">Fasting weight</p>
        <p class="mwp-title" style="font-size:19px; margin:0; color:#8F867E;">${checkin.fasting_weight_lb ?? '—'} lb</p>
      </div>
      ${weightChange !== null ? `<span class="mwp-body" style="font-size:12px; color:${weightChange < 0 ? '#8F867E' : '#C0392B'}; font-weight:600;">${weightChange > 0 ? '+' : ''}${weightChange} lb</span>` : ''}
    </div>

    ${checkin.body_fat_pct !== null || checkin.muscle_mass_pct !== null ? `
      <div style="display:grid; grid-template-columns: 1fr 1fr; gap:8px; margin-bottom:0.9rem;">
        <div style="background:#FFFFFF; border:0.5px solid rgba(0,0,0,0.06); border-radius:9px; padding:10px; text-align:center;">
          <p class="mwp-title" style="font-size:14px; margin:0; color:#8F867E;">${checkin.body_fat_pct ?? '—'}%</p>
          <p class="mwp-body" style="font-size:9px; color:#8F867E; margin:2px 0 0; text-transform:uppercase;">Body Fat</p>
        </div>
        <div style="background:#FFFFFF; border:0.5px solid rgba(0,0,0,0.06); border-radius:9px; padding:10px; text-align:center;">
          <p class="mwp-title" style="font-size:14px; margin:0; color:#8F867E;">${checkin.muscle_mass_pct ?? '—'}%</p>
          <p class="mwp-body" style="font-size:9px; color:#8F867E; margin:2px 0 0; text-transform:uppercase;">Muscle Mass</p>
        </div>
      </div>` : ''}

    ${photos.length ? `
      <div style="display:grid; grid-template-columns: repeat(${photos.length}, 1fr); gap:7px; margin-bottom:0.9rem;">
        ${photos.map((p) => `<div style="aspect-ratio:3/4; background:#FFFFFF; border-radius:9px; overflow:hidden;"><img src="${sb.storage.from('photos').getPublicUrl(p.storage_path).data.publicUrl}" style="width:100%; height:100%; object-fit:cover;" /></div>`).join('')}
      </div>` : ''}

    <div style="display:flex; flex-direction:column; gap:6px; margin-bottom:1rem;">
      ${scoreRow('Hunger', checkin.hunger_level)}
      ${scoreRow('Energy', checkin.energy_level)}
      ${scoreRow('Plan adherence', checkin.adherence_level)}
      ${scoreRow('Stress / sleep', checkin.stress_level)}
    </div>

    <p class="mwp-body" style="font-size:11px; font-weight:600; letter-spacing:0.5px; color:#8F867E; margin:0 0 7px; text-transform:uppercase;">General feedback</p>
    <div style="background:#FFFFFF; border:0.5px solid rgba(0,0,0,0.06); border-radius:10px; padding:12px 13px; margin-bottom:1.1rem;">
      <p class="mwp-body" style="font-size:12.5px; color:#8F867E; margin:0; line-height:1.5;">${checkin.feedback_text ? checkin.feedback_text : '<span style="opacity:0.6;">No feedback written.</span>'}</p>
    </div>

    <p class="mwp-body" style="font-size:11px; font-weight:600; letter-spacing:0.5px; color:#8F867E; margin:0 0 7px; text-transform:uppercase;">Reply to ${client.full_name.split(' ')[0]}</p>
    <textarea id="replyInput" placeholder="Write your reply..." class="mwp-textarea" style="height:70px; margin-bottom:1.2rem;">${checkin.coach_reply || ''}</textarea>

    <p id="replyError" class="mwp-error" style="display:none;"></p>
    <p id="replySuccess" class="mwp-body" style="color:#8F867E; font-size:12px; margin:0 0 10px; display:none;">Reply sent.</p>
    <button id="replyBtn" class="mwp-btn">Send Reply</button>
  `;

  document.getElementById('replyBtn').addEventListener('click', async () => {
    const btn = document.getElementById('replyBtn');
    const errEl = document.getElementById('replyError');
    const successEl = document.getElementById('replySuccess');
    errEl.style.display = 'none';
    successEl.style.display = 'none';
    btn.disabled = true;

    const { error } = await sb.from('checkins').update({ coach_reply: document.getElementById('replyInput').value.trim() }).eq('id', checkin.id);

    if (error) {
      errEl.textContent = error.message;
      errEl.style.display = 'block';
    } else {
      successEl.style.display = 'block';
    }
    btn.disabled = false;
  });
})();
</script>
</body>
</html>
