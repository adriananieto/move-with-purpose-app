<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#211E1B" />
<link rel="manifest" href="manifest.json" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="MOVA" />
<link rel="apple-touch-icon" href="assets/mova-app-icon.png" />
<link rel="icon" href="assets/mova-app-icon.png" />
<title>MOVA · Reset Password</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.46.0/dist/tabler-icons.min.css" />
<link rel="stylesheet" href="css/app.css?v=4" />
</head>
<body>

<div class="mwp-card">
  <div class="mwp-header">
    <div class="mwp-logo" id="logoSlot"></div>
  </div>
  <p class="mwp-section-title" style="text-align:center;">Set a new password</p>

  <p id="formError" class="mwp-error" style="display:none;"></p>
  <p id="formNotice" class="mwp-body" style="color:var(--latte); font-size:12.5px; margin:0 0 10px; display:none;"></p>

  <div id="waitingState">
    <p class="mwp-body" style="color:var(--latte); font-size:13px; text-align:center; padding:1rem 0;">Checking your reset link…</p>
  </div>

  <form id="resetForm" style="display:none;">
    <div style="margin-bottom:8px;">
      <input class="mwp-input" type="password" id="password" placeholder="New password" required minlength="6" />
    </div>
    <div style="margin-bottom:14px;">
      <input class="mwp-input" type="password" id="confirmPassword" placeholder="Confirm new password" required minlength="6" />
    </div>
    <button type="submit" id="submitBtn" class="mwp-btn">Save Password</button>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/nav.js"></script>
<script>
document.getElementById('logoSlot').innerHTML = MOVA_WORDMARK_SVG;

const waitingState = document.getElementById('waitingState');
const resetForm = document.getElementById('resetForm');
const formError = document.getElementById('formError');
const formNotice = document.getElementById('formNotice');

function showForm() {
  waitingState.style.display = 'none';
  resetForm.style.display = 'block';
}

sb.auth.onAuthStateChange((event) => {
  if (event === 'PASSWORD_RECOVERY') showForm();
});

(async () => {
  // Covers the case where the PASSWORD_RECOVERY event already fired before this listener attached.
  const { data: { session } } = await sb.auth.getSession();
  if (session) {
    showForm();
  } else {
    setTimeout(async () => {
      const { data: { session: retrySession } } = await sb.auth.getSession();
      if (retrySession) {
        showForm();
      } else {
        waitingState.innerHTML = '<p class="mwp-body" style="color:var(--latte); font-size:13px; text-align:center; padding:1rem 0;">This reset link is invalid or has expired. Request a new one from the login screen.</p>';
      }
    }, 2500);
  }
})();

resetForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  formError.style.display = 'none';
  formNotice.style.display = 'none';

  const password = document.getElementById('password').value;
  const confirmPassword = document.getElementById('confirmPassword').value;
  if (password !== confirmPassword) {
    formError.textContent = 'Passwords don\'t match.';
    formError.style.display = 'block';
    return;
  }

  const submitBtn = document.getElementById('submitBtn');
  submitBtn.disabled = true;
  try {
    const { error } = await sb.auth.updateUser({ password });
    if (error) throw error;
    formNotice.textContent = 'Password saved. Taking you in…';
    formNotice.style.display = 'block';
    setTimeout(() => { window.location.href = 'home.html'; }, 900);
  } catch (err) {
    formError.textContent = err.message || 'Something went wrong. Please try again.';
    formError.style.display = 'block';
    submitBtn.disabled = false;
  }
});
</script>
</body>
</html>
