<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#211E1B" />
<link rel="manifest" href="manifest.json" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="MOVA" />
<link rel="apple-touch-icon" href="assets/mova-app-icon.png?v=2" />
<link rel="icon" href="assets/mova-app-icon.png?v=2" />
<title>MOVA · Home</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.46.0/dist/tabler-icons.min.css" />
<link rel="stylesheet" href="css/app.css?v=4" />
</head>
<body>

<div class="mwp-card" id="card">
  <p class="mwp-loading">Loading…</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/auth.js"></script>
<script src="js/nav.js"></script>
<script>
(async () => {
  const session = await requireSession();
  if (!session) return;
  const userId = session.user.id;
  const card = document.getElementById('card');

  const now = new Date();
  const todayStr = now.toISOString().slice(0, 10);
  const day = (now.getDay() + 6) % 7; // 0 = Monday
  const monday = new Date(now);
  monday.setDate(now.getDate() - day);
  monday.setHours(0, 0, 0, 0);
  const mondayStr = monday.toISOString().slice(0, 10);

  const [profileRes, daysRes, exerciseLogsRes, nutritionTargetRes, mealLogsRes] = await Promise.all([
    sb.from('profiles').select('full_name, phase_start_date').eq('id', userId).single(),
    sb.from('workout_days').select('id, day_number, name, workout_sections(id, exercises(id, target_sets))').order('day_number'),
    sb.from('exercise_logs').select('exercise_id, set_number, logged_at').eq('user_id', userId).gte('logged_at', mondayStr),
    sb.from('nutrition_targets').select('calories').eq('user_id', userId).single(),
    sb.from('meal_logs').select('total_calories').eq('user_id', userId).eq('logged_at', todayStr),
  ]);

  const fullName = profileRes.data?.full_name || 'there';
  const firstName = fullName.split(' ')[0];

  const workoutTarget = 5;
  const weekLogs = exerciseLogsRes.data || [];
  const daysTrained = new Set(weekLogs.map((l) => l.logged_at.slice(0, 10))).size;
  const sessionsDone = Math.min(daysTrained, workoutTarget);

  const days = daysRes.data || [];
  const setsLoggedByExercise = {};
  weekLogs
    .filter((l) => l.logged_at.slice(0, 10) === todayStr)
    .forEach((l) => {
      setsLoggedByExercise[l.exercise_id] = Math.max(setsLoggedByExercise[l.exercise_id] || 0, l.set_number);
    });

  function dayIsComplete(d) {
    const exercises = d.workout_sections.flatMap((s) => s.exercises);
    if (!exercises.length) return false;
    return exercises.every((e) => (setsLoggedByExercise[e.id] || 0) >= e.target_sets);
  }

  const todaysDay = days.find((d) => !dayIsComplete(d)) || days[0] || null;

  const caloriesTarget = nutritionTargetRes.data?.calories || 1800;
  const caloriesToday = (mealLogsRes.data || []).reduce((sum, m) => sum + (m.total_calories || 0), 0);

  card.innerHTML = `
    <div id="headerSlot"></div>

    <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom: 1.6rem;">
      <p class="mwp-title" style="font-size:26px; margin:0; color:var(--creme);">Hello, ${firstName}!</p>
      <button id="logoutBtn" style="width:38px; height:38px; border-radius:50%; background:var(--creme); border:none; display:flex; align-items:center; justify-content:center; flex-shrink:0; cursor:pointer;"><i class="ti ti-logout" style="font-size:18px; color:var(--ink);" aria-hidden="true"></i></button>
    </div>

    <div style="background:var(--latte); border-radius:14px; padding:1.3rem 1.2rem; margin-bottom:1rem;">
      <p class="mwp-label" style="font-size:10px; color:var(--ink); margin:0 0 7px;">Weekly Progress</p>
      <p class="mwp-title" style="font-size:26px; margin:0; color:var(--ink);">${sessionsDone} / ${workoutTarget} sessions</p>
    </div>

    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-bottom:1.2rem;">
      <a href="workout.html" style="text-decoration:none; background:var(--creme); border-radius:12px; padding:14px; display:block;">
        <i class="ti ti-barbell" style="font-size:20px; color:var(--ink);" aria-hidden="true"></i>
        <p class="mwp-title" style="font-size:14px; margin:10px 0 3px; color:var(--ink);">Training</p>
        <p class="mwp-body" style="font-size:12px; color:var(--latte); margin:0;">${todaysDay ? todaysDay.name : 'No program yet'}</p>
      </a>
      <a href="nutrition.html" style="text-decoration:none; background:var(--creme); border-radius:12px; padding:14px; display:block;">
        <i class="ti ti-apple" style="font-size:20px; color:var(--ink);" aria-hidden="true"></i>
        <p class="mwp-title" style="font-size:14px; margin:10px 0 3px; color:var(--ink);">Nutrition</p>
        <p class="mwp-body" style="font-size:12px; color:var(--latte); margin:0;">${caloriesToday} / ${caloriesTarget} kcal</p>
      </a>
    </div>

    ${todaysDay ? `
      <a href="workout-day.html?day=${todaysDay.id}" class="mwp-btn" style="display:block; text-align:center; text-decoration:none; box-sizing:border-box; margin-bottom:0.9rem;">Start Today's Session</a>
    ` : ''}

    <a href="checkin.html" style="text-decoration:none; display:block; text-align:center; padding:8px; margin-bottom:1.2rem;">
      <span class="mwp-body" style="font-size:12px; color:var(--latte); text-decoration:underline;">Submit weekly check-in</span>
    </a>

    <div data-bottom-nav></div>
  `;

  renderHeader(document.getElementById('headerSlot'), { userId });
  renderBottomNav('home');
  document.getElementById('logoutBtn').addEventListener('click', logout);
})();
</script>
</body>
</html>
