<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Move With Purpose" />
<title>Move With Purpose · Exercise</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.46.0/dist/tabler-icons.min.css" />
<link rel="stylesheet" href="css/app.css?v=3" />
</head>
<body>

<div class="mwp-card" id="card">
  <p class="mwp-loading">Loading…</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/auth.js"></script>
<script>
let userId, dayId, orderedExercises, current, todayStr;

async function loadDay() {
  const { data: day, error } = await sb
    .from('workout_days')
    .select('id, day_number, name, workout_sections(id, order_index, exercises(id, name, order_index, target_sets, target_reps, video_url))')
    .eq('id', dayId)
    .single();

  if (error || !day) {
    document.getElementById('card').innerHTML = '<p class="mwp-loading">Workout day not found.</p>';
    return null;
  }

  const sections = [...day.workout_sections].sort((a, b) => a.order_index - b.order_index);
  return sections.flatMap((s) => [...s.exercises].sort((a, b) => a.order_index - b.order_index));
}

async function loadState(exerciseId) {
  current = orderedExercises.find((e) => String(e.id) === String(exerciseId));
  if (!current) {
    renderNotFound();
    return;
  }

  const { data: todayLogs } = await sb
    .from('exercise_logs')
    .select('set_number')
    .eq('user_id', userId)
    .eq('exercise_id', current.id)
    .gte('logged_at', todayStr + 'T00:00:00')
    .order('set_number', { ascending: false })
    .limit(1);

  const setsDone = todayLogs?.[0]?.set_number || 0;
  current.currentSet = setsDone + 1;

  if (setsDone >= current.target_sets) {
    advanceToNext();
    return;
  }

  const { data: lastLog } = await sb
    .from('exercise_logs')
    .select('weight_lb, logged_at')
    .eq('user_id', userId)
    .eq('exercise_id', current.id)
    .lt('logged_at', todayStr + 'T00:00:00')
    .order('logged_at', { ascending: false })
    .limit(1);
  current.lastWeight = lastLog?.[0]?.weight_lb ?? null;

  render();
}

function render() {
  const idx = orderedExercises.findIndex((e) => e.id === current.id);
  const card = document.getElementById('card');
  card.innerHTML = `
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 1.2rem;">
      <a href="workout-day.html?day=${dayId}" style="line-height:0;"><i class="ti ti-chevron-left" style="font-size:20px; color:#8F867E;" aria-hidden="true"></i></a>
      <p class="mwp-body" style="font-size:11px; font-weight:600; letter-spacing:1px; color:#8F867E; margin:0; text-transform:uppercase;">Exercise ${idx + 1} of ${orderedExercises.length}</p>
      <span style="width:20px;"></span>
    </div>

    <div style="background:#FFFFFF; border:0.5px solid rgba(0,0,0,0.06); border-radius:14px; aspect-ratio:4/3; margin-bottom:1rem; display:flex; align-items:center; justify-content:center;">
      ${current.video_url
        ? `<video src="${current.video_url}" controls style="width:100%; height:100%; border-radius:14px; object-fit:cover;"></video>`
        : '<i class="ti ti-video" style="font-size:34px; color:#C4BEB4;" aria-hidden="true"></i>'}
    </div>

    <p class="mwp-title" style="font-size:22px; margin:0 0 4px; color:#8F867E; text-transform:uppercase; letter-spacing:0.3px;">${current.name}</p>
    <p class="mwp-body" style="font-size:13px; color:#8F867E; margin:0 0 1.2rem;">Set ${current.currentSet} of ${current.target_sets} · target ${current.target_reps} reps</p>

    <div style="background:#8F867E; border-radius:12px; padding:14px; margin-bottom:12px;">
      <p class="mwp-body" style="font-size:10px; font-weight:500; letter-spacing:1px; color:#EAE6E1; margin:0 0 8px; text-transform:uppercase;">Weight used</p>
      <div style="display:flex; align-items:center; gap:8px;">
        <input type="number" id="weightInput" value="${current.lastWeight ?? ''}" placeholder="0" style="flex:1; text-align:center; font-size:22px; font-weight:700; height:44px; border-radius:8px; border:none;" aria-label="Pounds used" />
        <span class="mwp-body" style="font-size:13px; color:#FFFFFF;">lb</span>
      </div>
    </div>

    <div style="display:flex; align-items:center; gap:6px; margin-bottom:1rem; font-size:12px; color:#8F867E;" class="mwp-body">
      <i class="ti ti-history" style="font-size:15px;" aria-hidden="true"></i>
      <span>${current.lastWeight !== null ? `Last time: ${current.lastWeight} lb` : 'No previous record'}</span>
    </div>

    <p class="mwp-body" style="font-size:11px; font-weight:600; letter-spacing:0.5px; color:#8F867E; margin:0 0 6px; text-transform:uppercase;">Notes (optional)</p>
    <textarea id="notesInput" placeholder="Anything that bothered you, couldn't complete, felt heavy..." class="mwp-textarea" style="height:56px; margin-bottom:1.2rem;"></textarea>

    <p id="saveError" class="mwp-error" style="display:none;"></p>
    <button id="saveBtn" class="mwp-btn">Save Set</button>
  `;

  document.getElementById('saveBtn').addEventListener('click', saveSet);
}

function renderNotFound() {
  document.getElementById('card').innerHTML = '<p class="mwp-loading">Exercise not found.</p>';
}

function renderDayComplete() {
  document.getElementById('card').innerHTML = `
    <div style="text-align:center; padding: 2.5rem 0;">
      <i class="ti ti-circle-check" style="font-size:44px; color:#8F867E;" aria-hidden="true"></i>
      <p class="mwp-title" style="font-size:20px; margin:1rem 0 6px; color:#8F867E; text-transform:uppercase;">Workout complete</p>
      <p class="mwp-body" style="font-size:13px; color:#8F867E; margin:0 0 1.3rem;">Great work today. See you next session.</p>
      <a href="workout.html" class="mwp-btn" style="display:block; text-decoration:none; box-sizing:border-box;">Back to training split</a>
    </div>
  `;
}

function advanceToNext() {
  const idx = orderedExercises.findIndex((e) => e.id === current.id);
  const next = orderedExercises[idx + 1];
  if (!next) {
    renderDayComplete();
    return;
  }
  window.location.href = `workout-exercise.html?exercise=${next.id}&day=${dayId}`;
}

async function saveSet() {
  const btn = document.getElementById('saveBtn');
  const errEl = document.getElementById('saveError');
  errEl.style.display = 'none';
  btn.disabled = true;
  const weight = parseFloat(document.getElementById('weightInput').value);
  const notes = document.getElementById('notesInput').value.trim();

  const { error } = await sb.from('exercise_logs').insert({
    user_id: userId,
    exercise_id: current.id,
    set_number: current.currentSet,
    weight_lb: isNaN(weight) ? null : weight,
    reps: current.target_reps,
    notes: notes || null,
  });

  if (error) {
    errEl.textContent = error.message;
    errEl.style.display = 'block';
    btn.disabled = false;
    return;
  }

  if (current.currentSet >= current.target_sets) {
    advanceToNext();
  } else {
    await loadState(current.id);
  }
}

(async () => {
  const session = await requireSession();
  if (!session) return;
  userId = session.user.id;
  todayStr = new Date().toISOString().slice(0, 10);

  const params = new URLSearchParams(window.location.search);
  const exerciseId = params.get('exercise');
  dayId = params.get('day');

  orderedExercises = await loadDay();
  if (!orderedExercises) return;

  await loadState(exerciseId);
})();
</script>
</body>
</html>
