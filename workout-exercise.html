<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#211E1B" />
<link rel="manifest" href="manifest.json" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="MOVA" />
<link rel="apple-touch-icon" href="assets/mova-app-icon.png?v=2" />
<link rel="icon" href="assets/mova-app-icon.png?v=2" />
<title>MOVA · Exercise</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.46.0/dist/tabler-icons.min.css" />
<link rel="stylesheet" href="css/app.css?v=4" />
</head>
<body>

<div class="mwp-card" id="card">
  <p class="mwp-loading">Loading…</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/auth.js"></script>
<script src="js/nav.js"></script>
<script>
let userId, dayId, dayName, orderedExercises, current, todayStr;

async function loadDay() {
  const { data: day, error } = await sb
    .from('workout_days')
    .select('id, day_number, name, workout_sections(id, order_index, exercises(id, name, order_index, target_sets, target_reps, video_url))')
    .eq('id', dayId)
    .single();

  if (error || !day) {
    document.getElementById('card').innerHTML = '<p class="mwp-loading">Workout day not found.</p>';
    return null;
  }

  dayName = day.name;
  const sections = [...day.workout_sections].sort((a, b) => a.order_index - b.order_index);
  return sections.flatMap((s) => [...s.exercises].sort((a, b) => a.order_index - b.order_index));
}

async function loadState(exerciseId) {
  current = orderedExercises.find((e) => String(e.id) === String(exerciseId));
  if (!current) {
    renderNotFound();
    return;
  }

  const { data: todayLogs } = await sb
    .from('exercise_logs')
    .select('set_number, weight_lb')
    .eq('user_id', userId)
    .eq('exercise_id', current.id)
    .gte('logged_at', todayStr + 'T00:00:00');

  current.todayWeights = {};
  (todayLogs || []).forEach((l) => { current.todayWeights[l.set_number] = l.weight_lb; });
  const setsDone = Object.keys(current.todayWeights).length;
  current.currentSet = setsDone + 1;

  if (setsDone >= current.target_sets) {
    advanceToNext();
    return;
  }

  const { data: priorLogs } = await sb
    .from('exercise_logs')
    .select('weight_lb, logged_at')
    .eq('user_id', userId)
    .eq('exercise_id', current.id)
    .lt('logged_at', todayStr + 'T00:00:00')
    .order('logged_at', { ascending: false })
    .limit(30);

  current.topSetLastSession = null;
  if (priorLogs && priorLogs.length) {
    const latestDate = priorLogs[0].logged_at.slice(0, 10);
    const sameSession = priorLogs.filter((l) => l.logged_at.slice(0, 10) === latestDate && l.weight_lb !== null);
    if (sameSession.length) {
      current.topSetLastSession = Math.max(...sameSession.map((l) => Number(l.weight_lb)));
    }
  }

  render();
}

function setRow(setNumber) {
  const completed = current.todayWeights[setNumber] !== undefined;
  const isCurrent = setNumber === current.currentSet;

  if (completed) {
    return `
      <div style="display:flex; align-items:center; justify-content:space-between; background:var(--creme); border-radius:10px; padding:10px 14px;">
        <span class="mwp-body" style="font-size:13px; color:var(--ink);">Set ${setNumber}</span>
        <div style="display:flex; align-items:center; gap:8px;">
          <span class="mwp-body" style="font-size:13px; color:var(--ink);">${current.todayWeights[setNumber] ?? '—'} lb</span>
          <i class="ti ti-circle-check-filled" style="font-size:17px; color:var(--ink);" aria-hidden="true"></i>
        </div>
      </div>`;
  }

  if (isCurrent) {
    return `
      <div style="background:var(--latte); border-radius:10px; padding:10px 14px;">
        <div style="display:flex; align-items:center; justify-content:space-between; gap:10px;">
          <span class="mwp-label" style="font-size:12px; color:var(--ink);">Set ${setNumber}</span>
          <div style="display:flex; align-items:center; gap:6px;">
            <input type="number" id="weightInput" value="${current.topSetLastSession ?? ''}" placeholder="0" style="width:64px; text-align:center; font-size:16px; font-weight:600; height:34px; border-radius:6px; border:none; font-family:'Poppins',sans-serif;" aria-label="Pounds used" />
            <span class="mwp-body" style="font-size:12px; color:var(--ink);">lb</span>
          </div>
        </div>
      </div>`;
  }

  return `
    <div style="display:flex; align-items:center; background:transparent; border:0.5px solid var(--creme); border-radius:10px; padding:10px 14px;">
      <span class="mwp-body" style="font-size:13px; color:var(--latte);">Set ${setNumber}</span>
    </div>`;
}

function render() {
  const idx = orderedExercises.findIndex((e) => e.id === current.id);
  const card = document.getElementById('card');
  card.innerHTML = `
    <div id="headerSlot"></div>
    <div style="display:flex; align-items:center; gap:8px; margin-bottom:4px;">
      <a href="workout-day.html?day=${dayId}" style="line-height:0; flex-shrink:0;"><i class="ti ti-chevron-left" style="font-size:15px; color:var(--latte);" aria-hidden="true"></i></a>
      <p class="mwp-body" style="font-size:13px; color:var(--latte); margin:0; text-align:center; flex:1;">${dayName}</p>
      <span style="width:15px; flex-shrink:0;"></span>
    </div>
    <p class="mwp-label" style="font-size:11px; color:var(--latte); margin:0 0 1.1rem; text-align:center;">Exercise ${idx + 1} of ${orderedExercises.length}</p>

    <div style="background:var(--creme); border-radius:14px; aspect-ratio:4/3; margin-bottom:1rem; display:flex; align-items:center; justify-content:center;">
      ${current.video_url
        ? `<video src="${current.video_url}" controls style="width:100%; height:100%; border-radius:14px; object-fit:cover;"></video>`
        : '<i class="ti ti-video" style="font-size:34px; color:var(--latte);" aria-hidden="true"></i>'}
    </div>

    <p class="mwp-title" style="font-size:22px; margin:0 0 4px; color:var(--creme);">${current.name}</p>
    <p class="mwp-body" style="font-size:13px; color:var(--latte); margin:0 0 1.1rem;">${current.target_sets} sets · ${current.target_reps} reps</p>

    <div style="display:flex; flex-direction:column; gap:8px; margin-bottom:12px;">
      ${Array.from({ length: current.target_sets }, (_, i) => setRow(i + 1)).join('')}
    </div>

    <div style="display:flex; align-items:center; gap:6px; margin-bottom:1rem; font-size:12px; color:var(--latte);" class="mwp-body">
      <i class="ti ti-history" style="font-size:15px;" aria-hidden="true"></i>
      <span>${current.topSetLastSession !== null ? `Top set last session: ${current.topSetLastSession} lb` : 'No previous record'}</span>
    </div>

    <p class="mwp-label" style="font-size:11px; color:var(--latte); margin:0 0 6px;">Notes (optional)</p>
    <textarea id="notesInput" placeholder="Anything that bothered you, couldn't complete, felt heavy..." class="mwp-textarea" style="height:56px; margin-bottom:1.2rem;"></textarea>

    <p id="saveError" class="mwp-error" style="display:none;"></p>
    <button id="saveBtn" class="mwp-btn">Complete Set ${current.currentSet}</button>
  `;

  renderHeader(document.getElementById('headerSlot'), { userId });
  document.getElementById('saveBtn').addEventListener('click', saveSet);
}

function renderNotFound() {
  document.getElementById('card').innerHTML = '<p class="mwp-loading">Exercise not found.</p>';
}

function renderDayComplete() {
  document.getElementById('card').innerHTML = `
    <div style="text-align:center; padding: 2.5rem 0;">
      <i class="ti ti-circle-check" style="font-size:44px; color:var(--creme);" aria-hidden="true"></i>
      <p class="mwp-title" style="font-size:20px; margin:1rem 0 6px; color:var(--creme);">Workout complete</p>
      <p class="mwp-body" style="font-size:13px; color:var(--latte); margin:0 0 1.3rem;">Great work today. See you next session.</p>
      <a href="workout.html" class="mwp-btn" style="display:block; text-decoration:none; box-sizing:border-box;">Back to training split</a>
    </div>
  `;
}

function advanceToNext() {
  const idx = orderedExercises.findIndex((e) => e.id === current.id);
  const next = orderedExercises[idx + 1];
  if (!next) {
    renderDayComplete();
    return;
  }
  window.location.href = `workout-exercise.html?exercise=${next.id}&day=${dayId}`;
}

async function saveSet() {
  const btn = document.getElementById('saveBtn');
  const errEl = document.getElementById('saveError');
  errEl.style.display = 'none';
  btn.disabled = true;
  const weight = parseFloat(document.getElementById('weightInput').value);
  const notes = document.getElementById('notesInput').value.trim();

  const { error } = await sb.from('exercise_logs').insert({
    user_id: userId,
    exercise_id: current.id,
    set_number: current.currentSet,
    weight_lb: isNaN(weight) ? null : weight,
    reps: current.target_reps,
    notes: notes || null,
  });

  if (error) {
    errEl.textContent = error.message;
    errEl.style.display = 'block';
    btn.disabled = false;
    return;
  }

  if (current.currentSet >= current.target_sets) {
    advanceToNext();
  } else {
    await loadState(current.id);
  }
}

(async () => {
  const session = await requireSession();
  if (!session) return;
  userId = session.user.id;
  todayStr = new Date().toISOString().slice(0, 10);

  const params = new URLSearchParams(window.location.search);
  const exerciseId = params.get('exercise');
  dayId = params.get('day');

  orderedExercises = await loadDay();
  if (!orderedExercises) return;

  await loadState(exerciseId);
})();
</script>
</body>
</html>
