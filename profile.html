<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#211E1B" />
<link rel="manifest" href="manifest.json" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="MOVA" />
<link rel="apple-touch-icon" href="assets/mova-app-icon.png" />
<link rel="icon" href="assets/mova-app-icon.png" />
<title>MOVA · Profile</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.46.0/dist/tabler-icons.min.css" />
<link rel="stylesheet" href="css/app.css?v=4" />
</head>
<body>

<div class="mwp-card" id="card">
  <p class="mwp-loading">Loading…</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/auth.js"></script>
<script src="js/nav.js"></script>
<script>
let userId;

function initials(name) {
  return name.split(' ').filter(Boolean).slice(0, 2).map((p) => p[0].toUpperCase()).join('');
}

function weeksSince(dateStr) {
  const ms = Date.now() - new Date(dateStr).getTime();
  return Math.max(1, Math.floor(ms / (7 * 24 * 60 * 60 * 1000)));
}

function normalize(values) {
  const nums = values.filter((v) => v !== null).map(Number);
  const min = Math.min(...nums);
  const max = Math.max(...nums);
  const range = max - min || 1;
  return values.map((v) => (v === null ? null : (1 - (Number(v) - min) / range)));
}

function seriesToPoints(values, stepX) {
  const norm = normalize(values);
  return norm.map((v, i) => {
    if (v === null) return null;
    const x = 10 + i * stepX;
    const y = 15 + v * 45;
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  });
}

function polylines(points) {
  // Break the line at any null (missing) values instead of connecting across gaps.
  const segments = [];
  let current = [];
  points.forEach((p) => {
    if (p === null) {
      if (current.length) segments.push(current);
      current = [];
    } else {
      current.push(p);
    }
  });
  if (current.length) segments.push(current);
  return segments;
}

function weightChart(logs) {
  if (logs.length < 2) {
    return '<p class="mwp-body" style="font-size:12.5px; color:var(--latte); text-align:center; padding:22px 0;">Log your weight during a check-in to see your progress here.</p>';
  }
  const stepX = 260 / (logs.length - 1);
  const weightPts = seriesToPoints(logs.map((l) => l.weight_lb), stepX);
  const fatPts = seriesToPoints(logs.map((l) => l.body_fat_pct), stepX);
  const musclePts = seriesToPoints(logs.map((l) => l.muscle_mass_lb), stepX);

  const line = (pts, dash, width) => polylines(pts).map((seg) =>
    `<polyline points="${seg.join(' ')}" fill="none" stroke="var(--ink)" stroke-width="${width}" stroke-linecap="round" stroke-linejoin="round" ${dash ? `stroke-dasharray="${dash}"` : ''}/>`
  ).join('');

  return `
    <svg viewBox="0 0 280 60" style="width:100%; height:60px;">
      ${line(musclePts, '5,2.5', 1.6)}
      ${line(fatPts, '2,2', 1.6)}
      ${line(weightPts, null, 2.5)}
    </svg>
    <div style="display:flex; justify-content:space-between; font-size:11px; color:var(--latte); margin:5px 0 12px;" class="mwp-body">
      <span>${logs[0].logged_at}</span><span>${logs[logs.length - 1].logged_at}</span>
    </div>
    <div style="display:flex; gap:14px; flex-wrap:wrap;">
      <span class="mwp-body" style="font-size:10.5px; color:var(--ink); display:flex; align-items:center; gap:5px;"><span style="width:12px; height:2.5px; background:var(--ink); display:inline-block;"></span>Weight</span>
      <span class="mwp-body" style="font-size:10.5px; color:var(--ink); display:flex; align-items:center; gap:5px;"><span style="width:12px; height:1.6px; background:repeating-linear-gradient(90deg, var(--ink) 0 3px, transparent 3px 6px); display:inline-block;"></span>Body Fat</span>
      <span class="mwp-body" style="font-size:10.5px; color:var(--ink); display:flex; align-items:center; gap:5px;"><span style="width:12px; height:1.6px; background:repeating-linear-gradient(90deg, var(--ink) 0 3px, transparent 3px 6px); display:inline-block;"></span>Muscle Mass</span>
    </div>`;
}

function photoTile(photo) {
  const url = sb.storage.from('photos').getPublicUrl(photo.storage_path).data.publicUrl;
  return `<div style="aspect-ratio:3/4; background:var(--creme); border-radius:10px; overflow:hidden;"><img src="${url}" alt="Progress photo" style="width:100%; height:100%; object-fit:cover;" /></div>`;
}

function statTile(value, label) {
  return `
    <div style="background:var(--creme); border-radius:11px; padding:12px; text-align:center;">
      <p class="mwp-title" style="font-size:16px; margin:0; color:var(--ink);">${value}</p>
      <p class="mwp-label" style="font-size:9px; color:var(--latte); margin:3px 0 0;">${label}</p>
    </div>`;
}

async function loadAndRender() {
  const [profileRes, weightRes, photosRes] = await Promise.all([
    sb.from('profiles').select('*').eq('id', userId).single(),
    sb.from('body_weight_logs').select('*').eq('user_id', userId).order('logged_at', { ascending: true }),
    sb.from('progress_photos').select('*').eq('user_id', userId).order('taken_at', { ascending: false }).limit(2),
  ]);

  const profile = profileRes.data;
  const weightLogs = weightRes.data || [];
  const photos = photosRes.data || [];

  const current = weightLogs.length ? Number(weightLogs[weightLogs.length - 1].weight_lb) : null;
  const first = weightLogs.length ? Number(weightLogs[0].weight_lb) : null;
  const change = current !== null && first !== null ? (current - first).toFixed(1) : null;
  const memberSince = new Date(profile.member_since).toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

  const latestBodyFat = [...weightLogs].reverse().find((l) => l.body_fat_pct !== null);
  const latestMuscle = [...weightLogs].reverse().find((l) => l.muscle_mass_lb !== null);

  document.getElementById('card').innerHTML = `
    <div id="headerSlot"></div>

    <div style="display:flex; align-items:center; gap:14px; margin-bottom:1.3rem;">
      <div style="width:56px; height:56px; border-radius:50%; background:var(--latte); display:flex; align-items:center; justify-content:center;">
        <span class="mwp-title" style="font-size:17px; color:var(--ink);">${initials(profile.full_name)}</span>
      </div>
      <div style="flex:1;">
        <p class="mwp-title" style="font-size:17px; margin:0; color:var(--creme);">${profile.full_name}</p>
        <p class="mwp-body" style="font-size:11.5px; color:var(--latte); margin:0;">Member since ${memberSince}</p>
      </div>
      <span class="mwp-label" style="font-size:9px; background:var(--latte); color:var(--ink); padding:6px 11px; border-radius:6px;">${profile.plan_tier}</span>
    </div>

    <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:9px; margin-bottom:9px;">
      ${statTile(current !== null ? current + ' lb' : '—', 'Weight')}
      ${statTile(latestBodyFat ? latestBodyFat.body_fat_pct + '%' : '—', 'Body Fat')}
      ${statTile(latestMuscle ? latestMuscle.muscle_mass_lb + ' lb' : '—', 'Muscle Mass')}
    </div>

    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:9px; margin-bottom:1.3rem;">
      ${statTile(weeksSince(profile.member_since), 'Total Weeks')}
      ${statTile(change !== null ? (change > 0 ? '+' : '') + change + ' lb' : '—', 'Change Since Start')}
    </div>

    <p class="mwp-label" style="font-size:11px; color:var(--creme); margin:0 0 9px;">Body Composition</p>
    <div style="background:var(--creme); border-radius:12px; padding:16px; margin-bottom:1.3rem;">
      ${weightChart(weightLogs)}
    </div>

    <p class="mwp-label" style="font-size:11px; color:var(--creme); margin:0 0 9px;">Progress Photos</p>
    <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:9px; margin-bottom:0.5rem;">
      ${photos.map(photoTile).join('')}
      <label for="photoInput" style="cursor:pointer; aspect-ratio:3/4; background:var(--latte); border-radius:10px; display:flex; align-items:center; justify-content:center;"><i class="ti ti-plus" style="font-size:19px; color:var(--ink);" aria-hidden="true"></i></label>
    </div>
    <input type="file" id="photoInput" accept="image/*" style="display:none;" />
    <p id="photoError" class="mwp-error" style="display:none;"></p>

    <div data-bottom-nav></div>
  `;

  renderHeader(document.getElementById('headerSlot'), { userId, title: 'Profile' });
  renderBottomNav('profile');

  document.getElementById('photoInput').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const errEl = document.getElementById('photoError');
    errEl.style.display = 'none';
    const path = `${userId}/progress/${Date.now()}-${file.name}`;
    const { error: uploadError } = await sb.storage.from('photos').upload(path, file);
    if (uploadError) {
      errEl.textContent = uploadError.message;
      errEl.style.display = 'block';
      return;
    }
    await sb.from('progress_photos').insert({ user_id: userId, storage_path: path });
    await loadAndRender();
  });
}

(async () => {
  const session = await requireSession();
  if (!session) return;
  userId = session.user.id;
  await loadAndRender();
})();
</script>
</body>
</html>
