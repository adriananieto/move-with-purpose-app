<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#211E1B" />
<link rel="manifest" href="manifest.json" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="MOVA" />
<link rel="apple-touch-icon" href="assets/mova-app-icon.png?v=2" />
<link rel="icon" href="assets/mova-app-icon.png?v=2" />
<title>MOVA · Nutrition</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.46.0/dist/tabler-icons.min.css" />
<link rel="stylesheet" href="css/app.css?v=4" />
</head>
<body>

<div class="mwp-card" id="card">
  <p class="mwp-loading">Loading…</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/auth.js"></script>
<script src="js/nav.js"></script>
<script src="js/viewAs.js"></script>
<script src="js/meals.js"></script>
<script>
const MEAL_ICONS = { breakfast: 'ti-sun', snack_am: 'ti-coffee', lunch: 'ti-sun-high', snack_pm: 'ti-cookie', dinner: 'ti-moon' };

(async () => {
  const session = await requireSession();
  if (!session) return;
  const { userId, isReadOnly, viewAsName } = resolveViewer(session);
  renderViewAsBanner(viewAsName);
  const todayStr = new Date().toISOString().slice(0, 10);

  const [profileRes, targetRes, logsRes, mealTargetsRes] = await Promise.all([
    sb.from('profiles').select('extended_tracking').eq('id', userId).single(),
    sb.from('nutrition_targets').select('*').eq('user_id', userId).single(),
    sb.from('meal_logs').select('*').eq('user_id', userId).eq('logged_at', todayStr),
    sb.from('meal_targets').select('meal_type, label, sort_order').eq('user_id', userId),
  ]);

  const mealTargets = {};
  (mealTargetsRes.data || []).forEach((t) => { mealTargets[t.meal_type] = t; });
  const mealOrder = orderedMealTypes(mealTargets);

  const isExtended = !!profileRes.data?.extended_tracking;
  const extras = isExtended ? (await sb.from('profile_extras').select('*').eq('user_id', userId).maybeSingle()).data : null;

  const dayTypeKey = `mwp_daytype:${userId}:${todayStr}`;
  let dayType = localStorage.getItem(dayTypeKey) || 'training';

  const baseTarget = targetRes.data || { calories: 1800, protein_g: 130, carbs_g: 180, fat_g: 60 };
  const logs = logsRes.data || [];

  function targetForDayType(type) {
    if (!extras) return baseTarget;
    const prefix = type === 'training' ? 'tr' : 'rest';
    return {
      calories: extras[`${prefix}_kcal`] ?? baseTarget.calories,
      protein_g: extras[`${prefix}_protein_g`] ?? baseTarget.protein_g,
      carbs_g: extras[`${prefix}_carbs_g`] ?? baseTarget.carbs_g,
      fat_g: extras[`${prefix}_fat_g`] ?? baseTarget.fat_g,
    };
  }

  const totals = logs.reduce((acc, l) => ({
    calories: acc.calories + (l.total_calories || 0),
    protein_g: acc.protein_g + Number(l.protein_g || 0),
    carbs_g: acc.carbs_g + Number(l.carbs_g || 0),
    fat_g: acc.fat_g + Number(l.fat_g || 0),
  }), { calories: 0, protein_g: 0, carbs_g: 0, fat_g: 0 });

  const loggedMealTypes = new Set(logs.map((l) => l.meal_type));
  const circumference = 188;

  function bar(label, value, max) {
    const pct = Math.min(Math.round((value / max) * 100), 100);
    return `
      <div>
        <div style="display:flex; justify-content:space-between; font-size:12px; margin-bottom:3px; color:var(--latte);" class="mwp-body"><span>${label}</span><span>${Math.round(value)}/${max}g</span></div>
        <div style="height:4px; background:rgba(160,144,134,0.35); border-radius:2px;"><div style="width:${pct}%; height:100%; background:var(--creme); border-radius:2px;"></div></div>
      </div>`;
  }

  function mealRow(type) {
    const done = loggedMealTypes.has(type);
    return `
      <a href="log-meal.html?type=${type}" style="text-decoration:none; display:flex; align-items:center; gap:12px; background:var(--creme); border-radius:12px; padding:13px 14px;">
        <i class="ti ${MEAL_ICONS[type]}" style="font-size:18px; color:var(--ink);" aria-hidden="true"></i>
        <div style="flex:1;">
          <p class="mwp-title" style="font-size:14px; margin:0; color:var(--ink);">${mealLabel(type, mealTargets)}</p>
        </div>
        ${done
          ? '<i class="ti ti-check" style="font-size:17px; color:var(--ink);" aria-hidden="true"></i>'
          : '<div style="width:15px; height:15px; border-radius:50%; border:1.5px solid var(--latte);"></div>'}
      </a>`;
  }

  function daytypeBtn(type, label) {
    const active = dayType === type;
    return `<div class="daytype-btn ${active ? 'active' : ''}" data-type="${type}" style="flex:1; text-align:center; padding:8px 0; border-radius:7px; font-size:12px; font-family:'Poppins',sans-serif; cursor:pointer; background:${active ? 'var(--latte)' : 'var(--creme)'}; color:var(--ink);">${label}</div>`;
  }

  function draw() {
    const target = targetForDayType(dayType);
    const calPct = Math.min(totals.calories / target.calories, 1);
    const dashOffset = Math.round(circumference * (1 - calPct));

    document.getElementById('card').innerHTML = `
      <div id="headerSlot"></div>

      ${isExtended ? `
        <div style="display:flex; gap:8px; margin-bottom:1.1rem;">
          ${daytypeBtn('training', 'Training Day')}
          ${daytypeBtn('rest', 'Rest Day')}
        </div>` : ''}

      <div style="display:flex; align-items:center; gap:1.1rem; margin-bottom:1.3rem;">
        <div style="position:relative; width:82px; height:82px; flex-shrink:0;">
          <svg viewBox="0 0 72 72" style="width:82px; height:82px; transform:rotate(-90deg);">
            <circle cx="36" cy="36" r="30" fill="none" stroke="rgba(160,144,134,0.35)" stroke-width="6"/>
            <circle cx="36" cy="36" r="30" fill="none" stroke="var(--creme)" stroke-width="6" stroke-dasharray="${circumference}" stroke-dashoffset="${dashOffset}" stroke-linecap="round"/>
          </svg>
          <div style="position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;">
            <span class="mwp-title" style="font-size:16px; color:var(--creme);">${totals.calories}</span>
            <span class="mwp-body" style="font-size:9px; color:var(--latte);">/ ${target.calories}</span>
          </div>
        </div>
        <div style="flex:1; display:flex; flex-direction:column; gap:8px;">
          ${bar('Protein', totals.protein_g, target.protein_g)}
          ${bar('Carbs', totals.carbs_g, target.carbs_g)}
          ${bar('Fat', totals.fat_g, target.fat_g)}
        </div>
      </div>

      <a href="nutrition-plan.html" style="text-decoration:none; display:block; text-align:center; padding:8px; margin-bottom:0.6rem;">
        <span class="mwp-body" style="font-size:12px; color:var(--latte); text-decoration:underline;">View my nutrition plan</span>
      </a>

      <p class="mwp-label" style="font-size:11px; color:var(--creme); margin:0 0 9px;">Meals</p>
      <div style="display:flex; flex-direction:column; gap:8px;">
        ${mealOrder.map(mealRow).join('')}
      </div>

      ${isExtended && (extras?.preferred_foods?.length || extras?.avoid_foods) ? `
        <div style="margin-top:1.1rem; display:flex; flex-direction:column; gap:7px;">
          ${extras.preferred_foods?.length ? `<p class="mwp-body" style="font-size:11.5px; color:var(--latte); margin:0;"><strong style="color:var(--creme);">Preferred:</strong> ${extras.preferred_foods.join(', ')}</p>` : ''}
          ${extras.avoid_foods ? `<p class="mwp-body" style="font-size:11.5px; color:var(--latte); margin:0;"><strong style="color:var(--creme);">Avoid:</strong> ${extras.avoid_foods}</p>` : ''}
        </div>` : ''}

      <div data-bottom-nav></div>
    `;

    renderHeader(document.getElementById('headerSlot'), { userId, title: 'Nutrition' });
    renderBottomNav('nutrition');
    if (isReadOnly) lockReadOnly(document.getElementById('card'));

    if (isExtended) {
      document.querySelectorAll('.daytype-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          dayType = btn.dataset.type;
          localStorage.setItem(dayTypeKey, dayType);
          draw();
        });
      });
    }
  }

  draw();
})();
</script>
</body>
</html>
