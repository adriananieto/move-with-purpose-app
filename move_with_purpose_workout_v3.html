<div style="max-width: 340px; margin: 0 auto;">
<style>
@import url('https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@400;500;600&display=swap');
.mwp-title { font-family: 'Anton', sans-serif; }
.mwp-body { font-family: 'Work Sans', sans-serif; }
</style>

<div style="position:relative; background: #D7D4D3; border-radius: 26px; padding: 1.6rem 1.3rem; overflow:hidden;">
  <svg viewBox="0 0 300 520" style="position:absolute; top:0; left:0; width:100%; height:100%; opacity:0.5;" preserveAspectRatio="none">
    <path d="M-20,20 C50,-10 100,40 170,20 C230,0 270,40 320,25" fill="none" stroke="#C4C0BC" stroke-width="1.3"/>
    <circle cx="255" cy="460" r="60" fill="none" stroke="#C4C0BC" stroke-width="1"/>
    <circle cx="255" cy="460" r="38" fill="none" stroke="#C4C0BC" stroke-width="1"/>
    <path d="M-20,480 C60,460 110,500 190,478 C250,462 290,490 320,478" fill="none" stroke="#C4C0BC" stroke-width="1.3"/>
  </svg>

  <div style="position:relative;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 1.2rem;">
      <i class="ti ti-chevron-left" style="font-size:18px; color:#8F867E;" aria-hidden="true"></i>
      <p class="mwp-body" style="font-size:10px; font-weight:600; letter-spacing:1px; color:#8F867E; margin:0; text-transform:uppercase;">Lower Body</p>
      <p class="mwp-body" style="font-size:10px; font-weight:600; color:#8F867E; margin:0;">3/8</p>
    </div>

    <div style="height:3px; background:rgba(0,0,0,0.08); border-radius:2px; margin-bottom:1.3rem; overflow:hidden;">
      <div style="width:37%; height:100%; background:#8F867E;"></div>
    </div>

    <div style="background:#FFFFFF; border:0.5px solid rgba(0,0,0,0.06); border-radius:14px; aspect-ratio:4/3; margin-bottom:1rem; display:flex; align-items:center; justify-content:center;">
      <i class="ti ti-video" style="font-size:32px; color:#C4BEB4;" aria-hidden="true"></i>
    </div>

    <p class="mwp-title" style="font-size:20px; margin:0 0 3px; color:#8F867E; text-transform:uppercase; letter-spacing:0.3px;">Bulgarian Split Squat</p>
    <p class="mwp-body" style="font-size:11px; color:#8F867E; margin:0 0 1.1rem;">Set 2 of 4 · target 12 reps</p>

    <div style="background:#8F867E; border-radius:12px; padding:14px; margin-bottom:12px;">
      <p class="mwp-body" style="font-size:9px; font-weight:500; letter-spacing:1px; color:#EAE6E1; margin:0 0 8px; text-transform:uppercase;">Weight used</p>
      <div style="display:flex; align-items:center; gap:8px;">
        <input type="number" value="30" style="flex:1; text-align:center; font-size:20px; font-weight:700; height:40px; border-radius:8px; border:none;" aria-label="Pounds used" />
        <span class="mwp-body" style="font-size:12px; color:#FFFFFF;">lb</span>
      </div>
    </div>

    <div style="display:flex; align-items:center; gap:6px; margin-bottom:1.1rem; font-size:11px; color:#8F867E;" class="mwp-body">
      <i class="ti ti-history" style="font-size:14px;" aria-hidden="true"></i>
      <span>Last time: 25 lb</span>
    </div>

    <button class="mwp-title" style="width:100%; background:#8F867E; color:#FFFFFF; border:none; font-size:13px; padding:13px; border-radius:8px; text-transform:uppercase; letter-spacing:0.5px;">Save Set</button>
  </div>
</div>
</div>
